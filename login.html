<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0f1f"><link rel="icon" href="logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/app.css">
<title>Giriş Yap | Sytraex</title>
<meta name="robots" content="noindex">
</head>
<body data-active="login" data-title="login_title">
<div id="site-header"></div>
<main class="container auth-wrap">
  <div class="card narrow">
    <h1 data-i18n="login_title"></h1>
    <p class="sub" data-i18n="login_sub"></p>

    <div id="msg" class="alert hidden" role="alert"></div>

    <button class="btn btn-google" id="googleBtn" type="button">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      <span data-i18n="btn_google_login"></span>
    </button>

    <div class="divider" data-i18n="or_email"></div>

    <form id="loginForm" novalidate>
      <div class="field"><label for="email" data-i18n="label_email"></label><input id="email" type="email" autocomplete="email" required placeholder="ornek@gmail.com"></div>
      <div class="field"><label for="password" data-i18n="label_password"></label><input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"></div>
      <button class="btn btn-primary btn-block" id="submitBtn" type="submit" data-i18n="login_btn_submit"></button>
    </form>

    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;font-size:.9rem">
      <a href="forgot-password.html" data-i18n="login_forgot_pass"></a>
      <span class="muted"><span data-i18n="login_no_account"></span> <a href="register.html" data-i18n="nav_register"></a></span>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script type="module">
import { sb, initPage, state, $, t, nextTarget, setBusy, showAlert, hideAlert, friendlyError, qs } from './js/app.js';

await initPage();
if (state.user) { location.replace(nextTarget()); }

const msg = $('#msg');
if (qs.get('error_description')) showAlert(msg, qs.get('error_description'));
if (qs.get('reset') === 'ok') showAlert(msg, t('reset_done'), 'ok');

$('#googleBtn').onclick = async () => {
  hideAlert(msg);
  const next = qs.get('next');
  const redirectTo = location.origin + '/login.html' + (next ? `?next=${encodeURIComponent(next)}` : '');
  const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo } });
  if (error) showAlert(msg, friendlyError(error));
};

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault(); hideAlert(msg);
  const email = $('#email').value.trim(), password = $('#password').value;
  if (!email || !password) return showAlert(msg, t('err_fill_all'));
  const btn = $('#submitBtn'); setBusy(btn, true, t('please_wait'));
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { setBusy(btn, false); return showAlert(msg, friendlyError(error)); }
  location.href = nextTarget();
});
</script>
</body></html>
