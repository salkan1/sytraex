<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0f1f"><link rel="icon" href="logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/app.css">
<title>Sytraex | Share Your Travel Experience</title>
<meta name="description" content="Sytraex: seyahat deneyimlerini paylaş, gerçek gezginlerden ilham al. Share your travel experience.">
<meta property="og:title" content="Sytraex - Share Your Travel Experience"><meta property="og:image" content="https://www.sytraex.com/logo.png"><meta property="og:type" content="website">
</head>
<body data-active="home">
<div id="site-header"></div>
<main>
  <section class="hero container">
    <span class="pill"><i></i><span data-i18n="hero_pill"></span></span>
    <h1><span data-i18n="hero_title_1"></span><br><span style="color:var(--text)" data-i18n="hero_title_2"></span></h1>
    <p class="lead" data-i18n="hero_subtitle"></p>
    <div class="hero-cta">
      <a class="btn btn-primary" href="share-experience.html" data-i18n="hero_btn_share"></a>
      <a class="btn btn-ghost" href="search-results.html" data-i18n="hero_btn_explore"></a>
    </div>
  </section>

  <section class="container" style="margin-top:8px">
    <form class="searchbar" id="searchForm">
      <div class="field" style="margin:0"><label for="q" data-i18n="search_label_loc"></label><input id="q" type="search" data-i18n-ph="search_ph_loc" autocomplete="off"></div>
      <div class="field" style="margin:0"><label for="dur" data-i18n="search_label_duration"></label><select id="dur"></select></div>
      <div class="field" style="margin:0"><label for="mode" data-i18n="search_label_mode"></label><select id="mode"></select></div>
      <button class="btn btn-primary" type="submit" data-i18n="search_btn_submit"></button>
    </form>
  </section>

  <section class="section container">
    <div class="section-head"><div><h2 data-i18n="top_rated_title"></h2><p data-i18n="top_rated_sub"></p></div></div>
    <div class="grid" id="topGrid"></div>
  </section>

  <section class="section container" style="padding-top:8px">
    <div class="section-head"><div><h2 data-i18n="latest_title"></h2></div><a href="search-results.html" data-i18n="see_all"></a></div>
    <div class="grid" id="latestGrid"></div>
  </section>

  <section class="section container" style="padding-top:8px">
    <div class="section-head"><h2 data-i18n="how_title"></h2></div>
    <div class="features">
      <div class="feature"><div class="ico">📝</div><h3 data-i18n="how1_t"></h3><p data-i18n="how1_d"></p></div>
      <div class="feature"><div class="ico">🧭</div><h3 data-i18n="how2_t"></h3><p data-i18n="how2_d"></p></div>
      <div class="feature"><div class="ico">⭐</div><h3 data-i18n="how3_t"></h3><p data-i18n="how3_d"></p></div>
      <div class="feature"><div class="ico">🪙</div><h3 data-i18n="how4_t"></h3><p data-i18n="how4_d"></p></div>
    </div>
  </section>

  <section class="container section" style="padding-top:8px">
    <div class="cta-band"><h2 data-i18n="cta_title"></h2><p data-i18n="cta_desc"></p>
      <a class="btn btn-primary" id="ctaBtn" href="register.html" data-i18n="cta_btn"></a></div>
  </section>
</main>
<div id="site-footer"></div>
<script type="module">
import { sb, initPage, state, $, t, applyI18n, DURATIONS, MODES, durLabel, modeLabel, postCardHTML, skeletons, esc, attachCityAutocomplete } from './js/app.js';

function fillFilters(){
  const d=$('#dur'), m=$('#mode'), dv=d.value, mv=m.value;
  d.innerHTML = '<option value="">'+esc(t('search_opt_dur_all'))+'</option>'+DURATIONS.map(k=>'<option value="'+k+'">'+esc(durLabel(k))+'</option>').join('');
  m.innerHTML = '<option value="">'+esc(t('search_opt_mode_all'))+'</option>'+MODES.map(k=>'<option value="'+k+'">'+esc(modeLabel(k))+'</option>').join('');
  d.value=dv; m.value=mv;
}
async function load(){
  $('#topGrid').innerHTML = skeletons(3); $('#latestGrid').innerHTML = skeletons(3);
  const [top, latest] = await Promise.all([
    sb.from('posts_feed').select('*').gt('votes',0).order('avg_score',{ascending:false}).order('votes',{ascending:false}).limit(6),
    sb.from('posts_feed').select('*').order('created_at',{ascending:false}).limit(6)
  ]);
  const empty = '<div class="empty" style="grid-column:1/-1"><h3>'+esc(t('empty_posts_t'))+'</h3><p>'+esc(t('empty_posts_d'))+'</p><a class="btn btn-primary" href="share-experience.html">'+esc(t('hero_btn_share'))+'</a></div>';
  const err = '<div class="empty" style="grid-column:1/-1"><h3>'+esc(t('load_error'))+'</h3></div>';
  $('#topGrid').innerHTML = top.error ? err : (top.data.length ? top.data.map(postCardHTML).join('') : '<div class="empty" style="grid-column:1/-1"><p>'+esc(t('no_top_posts'))+'</p></div>');
  $('#latestGrid').innerHTML = latest.error ? err : (latest.data.length ? latest.data.map(postCardHTML).join('') : empty);
}
$('#searchForm').addEventListener('submit', e=>{ e.preventDefault();
  const p=new URLSearchParams(); if($('#q').value.trim()) p.set('q',$('#q').value.trim()); if($('#dur').value) p.set('dur',$('#dur').value); if($('#mode').value) p.set('mode',$('#mode').value);
  location.href='search-results.html?'+p; });
await initPage();
if(state.user){ const c=$('#ctaBtn'); c.href='share-experience.html'; c.textContent=t('hero_btn_share'); c.removeAttribute('data-i18n'); }
attachCityAutocomplete($('#q'), { fillMode: 'short' });
fillFilters(); applyI18n(); load();
window.addEventListener('langchange', ()=>{ fillFilters(); load(); if(state.user){ const c=$('#ctaBtn'); c.textContent=t('hero_btn_share'); } });
</script>
</body></html>
