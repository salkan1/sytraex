<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sytraex | Share Your Travel Experience</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    header {
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-img { width: 45px; height: 45px; }
    .logo-text h1 { margin: 0; font-size: 22px; color: #ffcc00; text-transform: lowercase; }
    .logo-text p { margin: 0; font-size: 11px; color: #aaa; }

    nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 20px; }
    nav ul li a { color: #fff; text-decoration: none; font-weight: 500; }
    nav ul li a:hover { color: #ffcc00; }

    .main-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }

    /* Arama Kartı */
    .search-card {
      background: #1e293b;
      border-radius: 16px;
      padding: 30px;
      border: 1px solid rgba(255, 204, 0, 0.3);
      margin-bottom: 40px;
    }

    .search-grid {
      display: grid;
      grid-template-columns: 2fr 1.2fr 1.2fr 1fr;
      gap: 15px;
      align-items: end;
    }

    @media (max-width: 800px) {
      .search-grid { grid-template-columns: 1fr; }
    }

    .form-group { position: relative; }
    .form-group label { display: block; font-size: 12px; color: #ffcc00; margin-bottom: 6px; font-weight: bold; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
    }

    .btn-search {
      padding: 12px;
      background: #ffcc00;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
    }

    .autocomplete-items {
      position: absolute;
      border: 1px solid #ffcc00;
      border-top: none;
      z-index: 9999;
      top: 100%;
      left: 0; right: 0;
      background-color: #1e293b;
      border-radius: 0 0 8px 8px;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }

    .autocomplete-items div {
      padding: 10px 12px;
      cursor: pointer;
      font-size: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .autocomplete-items div:hover { background-color: #ffcc00; color: #000; }

    /* En Çok Oy Alanlar */
    .section-title {
      color: #ffcc00;
      font-size: 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .post-card {
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: transform 0.3s, border-color 0.3s;
    }

    .post-card:hover {
      transform: translateY(-5px);
      border-color: #ffcc00;
    }

    .post-card img { width: 100%; height: 160px; object-fit: cover; }
    .post-card-body { padding: 18px; }
    .post-card-tag { font-size: 11px; background: rgba(255,204,0,0.15); color: #ffcc00; padding: 3px 8px; border-radius: 4px; }
    .post-card-title { font-size: 16px; font-weight: bold; margin: 10px 0 6px 0; color: #fff; }
    .post-card-rating { font-size: 13px; color: #ffcc00; margin-bottom: 6px; font-weight: bold; }
    .post-card-loc { font-size: 12px; color: #aaa; }

    footer { text-align: center; padding: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); color: #888; font-size: 13px; margin-top: 60px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <img src="logo.png" alt="Sytraex Logo" class="logo-img">
      <div class="logo-text">
        <h1>sytraex</h1>
        <p>Share Your Travel Experience</p>
      </div>
    </div>

    <nav>
      <ul>
        <li><a href="index.html" style="color:#ffcc00; font-weight:bold;">Ana Sayfa</a></li>
        <li><a href="profile.html">Profilim</a></li>
        <li><a href="whitepaper.html">White Paper (Stake SYTX)</a></li>
      </ul>
    </nav>
  </header>

  <div class="main-container">
    
    <!-- Arama Paneli -->
    <div class="search-card">
      <form action="search-results.html" method="GET" autocomplete="off">
        <div class="search-grid">
          <div class="form-group">
            <label for="searchLoc">Nereye Gitmek İstiyorsun?</label>
            <input type="text" name="location" id="searchLoc" placeholder="İlçe, il veya ülke yazın (Örn: Bodrum, Roma)...">
            <div id="searchAutocompleteList" class="autocomplete-items"></div>
          </div>

          <div class="form-group">
            <label for="searchDuration">Süre / Zaman:</label>
            <select name="duration" id="searchDuration">
              <option value="hepsi">Tüm Süreler</option>
              <option value="3 Saatlik Tur">3 Saatlik Hızlı Tur</option>
              <option value="Günübirlik">Günübirlik (6-12 Saat)</option>
              <option value="1 Gün">Tam 1 Gün</option>
              <option value="Hafta Sonu">Hafta Sonu (2-3 Gün)</option>
              <option value="1 Hafta">1 Hafta veya Daha Uzun</option>
            </select>
          </div>

          <div class="form-group">
            <label for="searchMode">Seyahat Modu:</label>
            <select name="mode" id="searchMode">
              <option value="hepsi">Tüm Konseptler</option>
              <option value="Gece Hayatı">🌙 Gece Hayatı & Eğlence</option>
              <option value="Gündüz Gezi">☀️ Gündüz Gezi & Şehir</option>
              <option value="Tarihsel">🏛️ Tarihsel & Kültür</option>
              <option value="Doğa">🌿 Doğa & Sakinlik</option>
              <option value="Yemek">🍕 Yemek & Gastronomi</option>
              <option value="Macera">🏄 Macera & Spor</option>
              <option value="Bütçe Dostu">💰 Bütçe Dostu</option>
            </select>
          </div>

          <button type="submit" class="btn-search">🔍 Deneyimleri Ara</button>
        </div>
      </form>
    </div>

    <!-- Öne Çıkanlar / En Çok Oy Alanlar -->
    <div class="section-title">
      <span>⭐ Topluluğun En Çok Oy Alan Seyahat Rotaları</span>
    </div>

    <div id="topRatedGrid" class="posts-grid">
      <p style="color:#aaa;">Öne çıkan rotalar yükleniyor...</p>
    </div>

  </div>

  <footer>
    <p>© 2026 Sytraex | Share Your Travel Experience</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA3pn_ZBSVVxperBuDSMJMrZ-bEt391J6E",
      authDomain: "sytraex-462b0.firebaseapp.com",
      projectId: "sytraex-462b0",
      storageBucket: "sytraex-462b0.firebasestorage.app",
      messagingSenderId: "379245018695",
      appId: "1:379245018695:web:0beff2afb3210a2f6cbb62"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Canlı Lokasyon Arama
    const searchLoc = document.getElementById("searchLoc");
    const autoList = document.getElementById("searchAutocompleteList");
    let debounceTimer;

    searchLoc.addEventListener("input", function() {
      const query = this.value.trim();
      autoList.innerHTML = "";
      if (query.length < 2) { autoList.style.display = "none"; return; }

      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&addressdetails=1&limit=6`)
          .then(res => res.json())
          .then(data => {
            autoList.innerHTML = "";
            if (data && data.length > 0) {
              data.forEach(item => {
                const div = document.createElement("div");
                const city = item.address.city || item.address.town || item.address.suburb || item.display_name.split(',')[0];
                const country = item.address.country || '';
                const fullText = `${city}${country ? ', ' + country : ''}`;

                div.innerHTML = `📍 <strong>${city}</strong> <small style="color:#aaa;">(${country})</small>`;
                div.addEventListener("click", () => {
                  searchLoc.value = fullText;
                  autoList.style.display = "none";
                });
                autoList.appendChild(div);
              });
              autoList.style.display = "block";
            }
          });
      }, 250);
    });

    document.addEventListener("click", (e) => {
      if (e.target !== searchLoc) autoList.style.display = "none";
    });

    // En Çok Oy Alan Gönderileri Yükle
    async function loadTopRatedPosts() {
      const grid = document.getElementById('topRatedGrid');

      try {
        const querySnapshot = await getDocs(collection(db, "posts"));
        const postsList = [];

        querySnapshot.forEach((docSnap) => {
          const post = docSnap.data();
          const ratings = post.ratings || {};
          const votes = Object.values(ratings);
          const totalVotes = votes.length;
          
          let avg = 0;
          if (totalVotes > 0) {
            avg = votes.reduce((a, b) => a + b, 0) / totalVotes;
          }

          postsList.push({
            id: docSnap.id,
            avgRating: avg,
            voteCount: totalVotes,
            ...post
          });
        });

        // Oylara Göre Sırala (Puanı yüksek olan en üste)
        postsList.sort((a, b) => b.avgRating - a.avgRating || b.voteCount - a.voteCount);

        if (postsList.length === 0) {
          grid.innerHTML = '<p style="color:#aaa; grid-column: 1/-1; text-align:center;">Henüz öne çıkan bir seyahat rotası yok.</p>';
          return;
        }

        grid.innerHTML = '';
        postsList.forEach((post) => {
          const card = document.createElement('div');
          card.className = 'post-card';
          card.onclick = () => window.location.href = `post-detail.html?id=${post.id}`;

          card.innerHTML = `
            <img src="${post.imageUrl}" alt="${post.title}" onerror="this.src='https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=500'">
            <div class="post-card-body">
              <span class="post-card-tag">${post.mode || 'Seyahat'}</span>
              <div class="post-card-title">${post.title}</div>
              <div class="post-card-rating">⭐ ${post.avgRating > 0 ? post.avgRating.toFixed(1) : 'Yeni'} / 5 <small style="color:#aaa;">(${post.voteCount} Oy)</small></div>
              <div class="post-card-loc">📍 ${post.location} • ⏱️ ${post.duration}</div>
            </div>
          `;
          grid.appendChild(card);
        });

      } catch (err) {
        console.error("Öne çıkanlar çekilemedi:", err);
        grid.innerHTML = '<p style="color:#ff4d4d; grid-column: 1/-1;">Rotalar yüklenirken hata oluştu.</p>';
      }
    }

    loadTopRatedPosts();
  </script>

</body>
</html>
