<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0f1f"><link rel="icon" href="logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/app.css">
<title>Deneyimini Paylaş | Sytraex</title>
<meta name="robots" content="noindex">
</head>
<body data-active="share" data-title="share_title">
<div id="site-header"></div>
<main class="container section">
  <div class="card form-card">
    <h1 style="font-size:1.8rem" id="pageTitle" data-i18n="share_title"></h1>
    <p class="mt" data-i18n="share_sub"></p>
    <div id="msg" class="alert hidden mt" role="alert"></div>

    <form id="f" novalidate class="mt-lg">
      <div class="field"><label for="title" data-i18n="f_title"></label><input id="title" type="text" maxlength="140" required data-i18n-ph="f_title_ph"></div>
      <div class="field"><label for="location" data-i18n="f_location"></label><input id="location" type="text" maxlength="120" required data-i18n-ph="f_location_ph"></div>
      <div class="row">
        <div class="field"><label for="duration" data-i18n="search_label_duration"></label><select id="duration"></select></div>
        <div class="field"><label for="mode" data-i18n="search_label_mode"></label><select id="mode"></select></div>
      </div>

      <div class="form-section" data-i18n="f_media"></div>
      <div class="field">
        <span class="label" data-i18n="f_photos"></span>
        <div class="dropzone" id="drop" tabindex="0" role="button"><span data-i18n="f_photos_pick"></span><br><small class="faint" data-i18n="f_photos_hint"></small></div>
        <input id="file" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
        <div class="previews" id="previews"></div>
      </div>
      <div class="field"><label for="youtube" data-i18n="f_youtube"></label><input id="youtube" type="url" maxlength="200" placeholder="https://www.youtube.com/watch?v=..."></div>

      <div class="form-section" data-i18n="f_details"></div>
      <div class="field"><label for="summary" data-i18n="detail_sec_summary"></label><textarea id="summary" maxlength="4000" required data-i18n-ph="ph_summary"></textarea><span class="hint" data-i18n="f_summary_hint"></span></div>
      <div class="field"><label for="sightseeing" data-i18n="detail_sec_sightseeing"></label><textarea id="sightseeing" maxlength="4000" data-i18n-ph="ph_sightseeing"></textarea></div>
      <div class="field"><label for="stay" data-i18n="detail_sec_stay"></label><textarea id="stay" maxlength="4000" data-i18n-ph="ph_stay"></textarea></div>
      <div class="field"><label for="food" data-i18n="detail_sec_food"></label><textarea id="food" maxlength="4000" data-i18n-ph="ph_food"></textarea></div>
      <div class="field"><label for="tips" data-i18n="detail_sec_tips"></label><textarea id="tips" maxlength="4000" data-i18n-ph="ph_tips"></textarea></div>

      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">
        <button class="btn btn-primary" id="submitBtn" type="submit" data-i18n="btn_publish"></button>
        <a class="btn btn-soft" href="profile.html?tab=posts" data-i18n="cancel"></a>
      </div>
    </form>
  </div>
</main>
<div id="site-footer"></div>
<script type="module">
import { sb, state, initPage, $, $$, t, qs, esc, applyI18n, setBusy, showAlert, hideAlert, friendlyError, toast, DURATIONS, MODES, durLabel, modeLabel, compressImage, uploadImage, removeImages, youtubeEmbed, safeImg } from './js/app.js';

const MAX = 10;
const editId = qs.get('edit');
let items = [];          // { url } (mevcut)  |  { blob, preview } (yeni)
let originalImages = [];

await initPage({ requireLogin: true });
if (!state.user) await new Promise(() => {});

function fillSelects() {
  const d = $('#duration'), m = $('#mode'), dv = d.value, mv = m.value;
  d.innerHTML = DURATIONS.map(k => `<option value="${k}">${esc(durLabel(k))}</option>`).join('');
  m.innerHTML = MODES.map(k => `<option value="${k}">${esc(modeLabel(k))}</option>`).join('');
  if (dv) d.value = dv; if (mv) m.value = mv;
}
fillSelects();

function renderPreviews() {
  $('#previews').innerHTML = items.map((it, i) => `<div class="preview"><img src="${esc(it.url || it.preview)}" alt="">
    <button type="button" data-rm="${i}" aria-label="remove">×</button>${i === 0 ? `<span class="cover">${esc(t('cover'))}</span>` : ''}</div>`).join('');
  $$('[data-rm]').forEach(b => b.onclick = () => { const it = items.splice(+b.dataset.rm, 1)[0]; if (it.preview) URL.revokeObjectURL(it.preview); renderPreviews(); });
  $('#drop').classList.toggle('hidden', items.length >= MAX);
}
async function addFiles(files) {
  hideAlert($('#msg'));
  for (const f of files) {
    if (items.length >= MAX) { toast(t('err_max_photos'), 'err'); break; }
    if (!/^image\/(jpeg|png|webp)$/.test(f.type)) { toast(t('err_photo_type'), 'err'); continue; }
    try { const blob = await compressImage(f); items.push({ blob, preview: URL.createObjectURL(blob) }); }
    catch { toast(t('err_photo_type'), 'err'); }
  }
  renderPreviews();
}
$('#drop').onclick = () => $('#file').click();
$('#drop').onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#file').click(); } };
$('#file').onchange = (e) => { addFiles([...e.target.files]); e.target.value = ''; };
['dragover', 'dragenter'].forEach(ev => $('#drop').addEventListener(ev, e => { e.preventDefault(); $('#drop').classList.add('drag'); }));
['dragleave', 'drop'].forEach(ev => $('#drop').addEventListener(ev, e => { e.preventDefault(); $('#drop').classList.remove('drag'); }));
$('#drop').addEventListener('drop', e => addFiles([...e.dataTransfer.files]));

// düzenleme modu
if (editId) {
  const { data, error } = await sb.from('posts').select('*').eq('id', editId).maybeSingle();
  if (error || !data || data.user_id !== state.user.id) { location.replace('profile.html?tab=posts'); await new Promise(() => {}); }
  $('#pageTitle').dataset.i18n = 'edit_title'; $('#submitBtn').dataset.i18n = 'btn_save';
  ['title', 'location', 'duration', 'mode', 'summary', 'sightseeing', 'stay', 'food', 'tips'].forEach(k => { $('#' + k).value = data[k] || ''; });
  $('#youtube').value = data.youtube_url || '';
  originalImages = data.images || [];
  items = originalImages.map(url => ({ url }));
  renderPreviews();
}
applyI18n();
window.addEventListener('langchange', () => { fillSelects(); renderPreviews(); });

$('#f').addEventListener('submit', async (e) => {
  e.preventDefault(); hideAlert($('#msg'));
  const v = id => $('#' + id).value.trim();
  const fail = (m) => { showAlert($('#msg'), m); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  if (v('title').length < 5) return fail(t('err_title_short'));
  if (v('location').length < 2) return fail(t('err_location'));
  if (!items.length) return fail(t('err_min_photo'));
  if (v('summary').length < 20) return fail(t('err_summary_short'));
  if (v('youtube') && !youtubeEmbed(v('youtube'))) return fail(t('err_youtube'));

  const btn = $('#submitBtn'); setBusy(btn, true, t('publishing'));
  try {
    const urls = [];
    for (const it of items) urls.push(it.url ? it.url : await uploadImage('post-images', it.blob));
    const row = {
      title: v('title'), location: v('location'), duration: $('#duration').value, mode: $('#mode').value,
      images: urls, youtube_url: v('youtube') || null, summary: v('summary'),
      sightseeing: v('sightseeing') || null, stay: v('stay') || null, food: v('food') || null, tips: v('tips') || null
    };
    let postId = editId;
    if (editId) {
      const { error } = await sb.from('posts').update(row).eq('id', editId);
      if (error) throw error;
      const removed = originalImages.filter(u => !urls.includes(u));
      if (removed.length) removeImages('post-images', removed).catch(() => {});
    } else {
      const { data, error } = await sb.from('posts').insert({ ...row, user_id: state.user.id }).select('id').single();
      if (error) throw error;
      postId = data.id;
    }
    toast(t(editId ? 'saved' : 'published'), 'ok');
    setTimeout(() => location.href = `post-detail.html?id=${postId}`, 600);
  } catch (err) {
    console.error(err);
    setBusy(btn, false); fail(friendlyError(err));
  }
});
</script>
</body></html>
