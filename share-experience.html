<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deneyim Paylaş | Sytraex</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    body { margin: 0; padding: 0; background-color: #0f172a; color: #ffffff; font-family: Arial, sans-serif; }
    header { background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-img { width: 45px; height: 45px; }
    .logo-text h1 { margin: 0; font-size: 22px; color: #ffcc00; text-transform: lowercase; }
    .logo-text p { margin: 0; font-size: 11px; color: #aaa; }
    .share-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .share-card { background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 204, 0, 0.3); border-radius: 16px; padding: 35px; }
    .share-card h2 { color: #ffcc00; margin-top: 0; margin-bottom: 25px; font-size: 26px; text-align: center; }
    .form-group { margin-bottom: 22px; position: relative; }
    .form-group label { display: block; font-size: 13px; color: #ffcc00; margin-bottom: 8px; font-weight: bold; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; background: #0f172a; color: #fff; font-size: 14px; box-sizing: border-box; }
    .form-group textarea { resize: vertical; min-height: 90px; }
    .image-preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; margin-top: 12px; }
    .preview-item { position: relative; width: 100%; height: 90px; border-radius: 8px; overflow: hidden; border: 2px solid rgba(255, 204, 0, 0.4); }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; }
    .remove-btn { position: absolute; top: 4px; right: 4px; background: rgba(239, 68, 68, 0.85); color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; }
    .btn-upload-photos { display: inline-block; padding: 12px 20px; background: rgba(255, 204, 0, 0.15); border: 1px dashed #ffcc00; color: #ffcc00; border-radius: 8px; cursor: pointer; width: 100%; box-sizing: border-box; text-align: center; }
    .submit-btn { width: 100%; padding: 15px; background: #ffcc00; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
    .autocomplete-items { position: absolute; border: 1px solid #ffcc00; z-index: 9999; left: 0; right: 0; background-color: #1e293b; display: none; }
    .autocomplete-items div { padding: 12px; cursor: pointer; }
  </style>
  <script src="lang.js"></script>
</head>
<body>

  <header>
    <div class="logo">
      <img src="logo.png" alt="Sytraex Logo" class="logo-img">
      <div class="logo-text"><h1>sytraex</h1><p>Share Your Travel Experience</p></div>
    </div>
  </header>

  <div class="share-container">
    <div class="share-card">
      <h2 data-i18n="share_title">✈️ Seyahat Deneyimini Paylaş</h2>

      <form id="shareForm">
        <div class="form-group">
          <label data-i18n="share_label_post_title">Deneyim / Rota Başlığı:</label>
          <input type="text" id="postTitle" required>
        </div>

        <div class="form-group">
          <label data-i18n="share_label_loc">Nereye Seyahat Edildi?</label>
          <input type="text" id="locationInput" required>
          <div id="cityAutocompleteList" class="autocomplete-items"></div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="form-group">
            <label>Süre:</label>
            <select id="postDuration"><option value="Günübirlik">Günübirlik</option><option value="1 Hafta">1 Hafta</option></select>
          </div>
          <div class="form-group">
            <label>Mod:</label>
            <select id="postMode"><option value="Doğa">Doğa</option><option value="Kültür">Kültür</option></select>
          </div>
        </div>

        <div class="form-group">
          <label>Fotoğraflar:</label>
          <label for="filePhotoInput" class="btn-upload-photos">📷 Fotoğraf Seç</label>
          <input type="file" id="filePhotoInput" accept="image/*" multiple style="display:none;">
          <div id="imagePreviewGrid" class="image-preview-grid"></div>
        </div>

        <div class="form-group">
          <label>🎥 YouTube Video Bağlantısı (İsteğe Bağlı):</label>
          <input type="url" id="youtubeUrl" placeholder="https://youtube.com/...">
        </div>

        <div class="form-group">
          <label>📌 Özet:</label>
          <textarea id="summaryContent" required></textarea>
        </div>

        <!-- İsteğe bağlı alanlar (required kaldırıldı) -->
        <div class="form-group"><label>🏛️ Gezilecek Yerler:</label><textarea id="sightseeingContent"></textarea></div>
        <div class="form-group"><label>🏨 Konaklama:</label><textarea id="stayContent"></textarea></div>
        <div class="form-group"><label>🍕 Yeme & İçme:</label><textarea id="foodContent"></textarea></div>
        <div class="form-group"><label>🚌 Ulaşım & Tüyolar:</label><textarea id="tipsContent"></textarea></div>

        <button type="submit" id="submitBtn" class="submit-btn">🚀 Deneyimi Yayınla</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const app = initializeApp({/* Firebase Configin */});
    const db = getFirestore(app);
    const userData = JSON.parse(localStorage.getItem('sytraexUser'));

    let uploadedBase64Images = [];

    // Fotoğraf yükleme ve render işlemleri...
    document.getElementById('filePhotoInput').addEventListener('change', function(e) {
      Array.from(e.target.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = (ev) => {
           uploadedBase64Images.push(ev.target.result);
           renderPreviews();
        };
        reader.readAsDataURL(file);
      });
    });

    function renderPreviews() {
      const grid = document.getElementById('imagePreviewGrid');
      grid.innerHTML = uploadedBase64Images.map((img, idx) => `
        <div class="preview-item"><img src="${img}"><button type="button" class="remove-btn" onclick="removeImage(${idx})">✕</button></div>
      `).join('');
    }

    window.removeImage = (idx) => { uploadedBase64Images.splice(idx, 1); renderPreviews(); };

    document.getElementById('shareForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (uploadedBase64Images.length === 0) return alert("Fotoğraf seçin!");

      const youtubeUrl = document.getElementById('youtubeUrl').value.trim();
      const earnedSYTX = youtubeUrl ? 35 : 10; // Ödül Mantığı

      const newPost = {
        username: userData.username,
        title: document.getElementById('postTitle').value,
        location: document.getElementById('locationInput').value,
        imageUrl: uploadedBase64Images[0],
        images: uploadedBase64Images,
        youtubeUrl: youtubeUrl,
        rewardAmount: earnedSYTX, // Veritabanına kaydediyoruz
        details: {
          summary: document.getElementById('summaryContent').value,
          sightseeing: document.getElementById('sightseeingContent').value,
          stay: document.getElementById('stayContent').value,
          food: document.getElementById('foodContent').value,
          tips: document.getElementById('tipsContent').value
        },
        createdAt: new Date().toISOString()
      };

      await addDoc(collection(db, "posts"), newPost);
      alert(`Başarılı! ${earnedSYTX} SYTX kazandınız.`);
      window.location.href = "profile.html?tab=posts";
    });
  </script>
</body>
</html>
