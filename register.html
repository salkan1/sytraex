<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayıt Ol | Sytraex</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    header {
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-img { width: 45px; height: 45px; }
    .logo-text h1 { margin: 0; font-size: 22px; color: #ffcc00; text-transform: lowercase; }
    .logo-text p { margin: 0; font-size: 11px; color: #aaa; }

    nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 20px; }
    nav ul li a { color: #fff; text-decoration: none; font-weight: 500; }
    nav ul li a:hover { color: #ffcc00; }

    .register-container {
      max-width: 500px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .register-card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 204, 0, 0.3);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .register-card h2 {
      color: #ffcc00;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 24px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #ffcc00;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 11px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
    }

    .autocomplete-items {
      position: absolute;
      border: 1px solid #ffcc00;
      border-top: none;
      z-index: 9999;
      top: 100%;
      left: 0; right: 0;
      background-color: #1e293b;
      border-radius: 0 0 8px 8px;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }

    .autocomplete-items div {
      padding: 10px 12px;
      cursor: pointer;
      font-size: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .autocomplete-items div:hover {
      background-color: #ffcc00;
      color: #000;
    }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: #ffcc00;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }

    .submit-btn:hover { background: #e6b800; }

    footer { text-align: center; padding: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); color: #888; font-size: 13px; margin-top: 40px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <img src="logo.png" alt="Sytraex Logo" class="logo-img">
      <div class="logo-text">
        <h1>sytraex</h1>
        <p>Share Your Travel Experience</p>
      </div>
    </div>

    <nav>
      <ul>
        <li><a href="index.html">Ana Sayfa</a></li>
        <li><a href="login.html">Giriş Yap</a></li>
      </ul>
    </nav>
  </header>

  <div class="register-container">
    <div class="register-card">
      <h2>📝 Sytraex'e Kayıt Ol</h2>

      <form id="registerForm" autocomplete="off">
        <div class="form-group">
          <label for="regUsername">Kullanıcı Adı:</label>
          <input type="text" id="regUsername" placeholder="Örn: selcukalkan" required>
        </div>

        <div class="form-group">
          <label for="regName">Ad Soyad:</label>
          <input type="text" id="regName" placeholder="Örn: Selçuk Alkan" required>
        </div>

        <div class="form-group">
          <label for="regEmail">E-Posta Adresi:</label>
          <input type="email" id="regEmail" placeholder="ornek@gmail.com" required>
        </div>

        <div class="form-group">
          <label for="regPassword">Şifre:</label>
          <input type="password" id="regPassword" placeholder="••••••••" required>
        </div>

        <!-- Tek Kutu: Şehir ve Ülke -->
        <div class="form-group">
          <label for="regLocation">Yaşadığınız Şehir ve Ülke:</label>
          <input type="text" id="regLocation" placeholder="Şehir adı yazın (Örn: Tekirdağ, Türkiye)..." required>
          <div id="locationAutocompleteList" class="autocomplete-items"></div>
        </div>

        <div class="form-group">
          <label for="regBirth">Doğum Tarihi:</label>
          <input type="date" id="regBirth" required>
        </div>

        <div class="form-group">
          <label for="regSecretQuestion">Gizli Soru (Şifre Kurtarma İçin):</label>
          <select id="regSecretQuestion" required>
            <option value="pet">İlk evcil hayvanınızın adı nedir?</option>
            <option value="school">İlkokul öğretmeninizin adı nedir?</option>
            <option value="city">Annenizin doğduğu şehir neresidir?</option>
            <option value="car">İlk sahip olduğunuz arabanın markası nedir?</option>
          </select>
        </div>

        <div class="form-group">
          <label for="regSecretAnswer">Gizli Soru Cevabı:</label>
          <input type="text" id="regSecretAnswer" placeholder="Cevabınız..." required>
        </div>

        <button type="submit" id="regBtn" class="submit-btn">Kayıt Ol ve Katıl</button>
      </form>
    </div>
  </div>

  <footer>
    <p>© 2026 Sytraex | Share Your Travel Experience</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA3pn_ZBSVVxperBuDSMJMrZ-bEt391J6E",
      authDomain: "sytraex-462b0.firebaseapp.com",
      projectId: "sytraex-462b0",
      storageBucket: "sytraex-462b0.firebasestorage.app",
      messagingSenderId: "379245018695",
      appId: "1:379245018695:web:0beff2afb3210a2f6cbb62"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Canlı Lokasyon Arama
    const regLocation = document.getElementById("regLocation");
    const locList = document.getElementById("locationAutocompleteList");
    let debounceTimer;

    regLocation.addEventListener("input", function() {
      const query = this.value.trim();
      locList.innerHTML = "";
      if (query.length < 2) { locList.style.display = "none"; return; }

      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&addressdetails=1&limit=6`)
          .then(res => res.json())
          .then(data => {
            locList.innerHTML = "";
            if (data && data.length > 0) {
              data.forEach(item => {
                const div = document.createElement("div");
                const city = item.address.city || item.address.town || item.address.province || item.display_name.split(',')[0];
                const country = item.address.country || '';
                const locText = `${city}${country ? ', ' + country : ''}`;

                div.innerHTML = `📍 <strong>${city}</strong> <small style="color:#aaa;">(${country})</small>`;
                div.addEventListener("click", () => {
                  regLocation.value = locText;
                  locList.style.display = "none";
                });
                locList.appendChild(div);
              });
              locList.style.display = "block";
            }
          });
      }, 250);
    });

    document.addEventListener("click", (e) => {
      if (e.target !== regLocation) locList.style.display = "none";
    });

    // Kayıt Formu
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('regBtn');
      btn.innerText = "Kaydediliyor...";
      btn.disabled = true;

      const username = document.getElementById('regUsername').value.trim().toLowerCase();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const locationVal = regLocation.value.trim();
      const birth = document.getElementById('regBirth').value;
      const secretQuestion = document.getElementById('regSecretQuestion').value;
      const secretAnswer = document.getElementById('regSecretAnswer').value.trim();

      try {
        const userRef = doc(db, "users", username);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {
          alert("Bu kullanıcı adı zaten alınmış. Lütfen başka bir kullanıcı adı seçin.");
          btn.innerText = "Kayıt Ol ve Katıl";
          btn.disabled = false;
          return;
        }

        const newUser = {
          username: username,
          name: name,
          email: email,
          password: password,
          city: locationVal,
          country: locationVal.includes(',') ? locationVal.split(',')[1].trim() : '',
          birth: birth,
          secretQuestion: secretQuestion,
          secretAnswer: secretAnswer,
          avatarUrl: '',
          createdAt: new Date().toISOString()
        };

        await setDoc(userRef, newUser);

        localStorage.setItem('loggedIn', 'true');
        localStorage.setItem('sytraexUser', JSON.stringify(newUser));

        alert("Kayıt işlemi başarılı! Profile yönlendiriliyorsunuz.");
        window.location.href = "profile.html";

      } catch (err) {
        alert("Kayıt hatası: " + err.message);
        btn.innerText = "Kayıt Ol ve Katıl";
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
