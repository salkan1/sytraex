<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0f1f"><link rel="icon" href="logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/app.css">
<title>Kayıt Ol | Sytraex</title>
<meta name="robots" content="noindex">
</head>
<body data-active="register" data-title="reg_title">
<div id="site-header"></div>
<main class="container auth-wrap">
  <div class="card narrow" style="max-width:520px">
    <h1 data-i18n="reg_title"></h1>
    <p class="sub" data-i18n="reg_sub"></p>

    <div id="msg" class="alert hidden" role="alert"></div>

    <div id="formArea">
      <button class="btn btn-google" id="googleBtn" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span data-i18n="btn_google_register"></span>
      </button>
      <p class="hint center mt" data-i18n="google_terms_note"></p>

      <div class="divider" data-i18n="or_email"></div>

      <form id="regForm" novalidate>
        <div class="row">
          <div class="field"><label for="fullName" data-i18n="label_fullname"></label><input id="fullName" type="text" maxlength="80" autocomplete="name" required></div>
          <div class="field"><label for="username" data-i18n="label_username"></label><input id="username" type="text" maxlength="24" autocomplete="username" autocapitalize="none" spellcheck="false" required><span class="hint" id="unameHint" data-i18n="username_rule"></span></div>
        </div>
        <div class="field"><label for="email" data-i18n="label_email"></label><input id="email" type="email" autocomplete="email" required placeholder="ornek@gmail.com"><span class="hint" id="emailHint"></span></div>
        <div class="row">
          <div class="field"><label for="password" data-i18n="label_password"></label><input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="••••••••"><span class="hint" data-i18n="password_rule"></span></div>
          <div class="field"><label for="password2" data-i18n="label_password2"></label><input id="password2" type="password" autocomplete="new-password" required placeholder="••••••••"></div>
        </div>
        <div class="row">
          <div class="field"><label for="city" data-i18n="label_city"></label><input id="city" type="text" maxlength="80" autocomplete="address-level2" data-i18n-ph="ph_city"></div>
          <div class="field"><label for="country" data-i18n="label_country"></label><input id="country" type="text" maxlength="80" autocomplete="country-name" data-i18n-ph="ph_country"></div>
        </div>
        <label class="check"><input type="checkbox" id="terms" required><span data-i18n-html="terms_accept"></span></label>
        <button class="btn btn-primary btn-block" id="submitBtn" type="submit" data-i18n="reg_btn_submit"></button>
      </form>
      <p class="center muted mt" style="font-size:.9rem"><span data-i18n="reg_have_account"></span> <a href="login.html" data-i18n="nav_login"></a></p>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script type="module">
import { sb, initPage, state, $, t, nextTarget, setBusy, showAlert, hideAlert, friendlyError, applyI18n, attachCityAutocomplete, attachCountryAutocomplete, isEmailRegistered } from './js/app.js';

await initPage();
if (state.user) location.replace(nextTarget());
const msg = $('#msg');

$('#googleBtn').onclick = async () => {
  hideAlert(msg);
  const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + '/login.html' } });
  if (error) showAlert(msg, friendlyError(error));
};

// kullanıcı adı: canlı kontrol
const uname = $('#username'), hint = $('#unameHint');
let timer, unameOk = false;
const RULE = /^[a-z0-9_.]{3,24}$/;
uname.addEventListener('input', () => {
  uname.value = uname.value.toLowerCase().replace(/[^a-z0-9_.]/g, '');
  clearTimeout(timer); unameOk = false; hint.className = 'hint';
  if (!RULE.test(uname.value)) { hint.textContent = t('username_rule'); return; }
  hint.textContent = '…';
  timer = setTimeout(async () => {
    const { data, error } = await sb.rpc('username_available', { u: uname.value });
    if (error) { hint.textContent = ''; unameOk = true; return; }
    unameOk = !!data;
    hint.className = unameOk ? 'field-ok' : 'field-error';
    hint.textContent = unameOk ? t('username_ok') : t('username_taken');
  }, 350);
});

// e-posta: canlı kontrol (zaten kayıtlı mı)
const emailEl = $('#email'), emailHint = $('#emailHint');
let emailTimer, emailKnownTaken = false;
const EMAIL_RULE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
emailEl.addEventListener('input', () => {
  clearTimeout(emailTimer); emailKnownTaken = false; emailHint.className = 'hint'; emailHint.textContent = '';
  const v = emailEl.value.trim();
  if (!EMAIL_RULE.test(v)) return;
  emailHint.textContent = '…';
  emailTimer = setTimeout(async () => {
    const taken = await isEmailRegistered(v);
    if (taken === null) { emailHint.textContent = ''; return; }
    emailKnownTaken = taken;
    emailHint.className = taken ? 'field-error' : 'field-ok';
    emailHint.textContent = taken ? t('err_email_taken') : '';
  }, 400);
});

// şehir / ülke otomatik tamamlama
attachCityAutocomplete($('#city'), { fillMode: 'short' });
attachCountryAutocomplete($('#country'));

$('#regForm').addEventListener('submit', async (e) => {
  e.preventDefault(); hideAlert(msg);
  const v = id => $('#' + id).value.trim();
  if (!v('fullName') || !v('username') || !v('email') || !$('#password').value) return showAlert(msg, t('err_fill_all'));
  if (!RULE.test(v('username'))) return showAlert(msg, t('username_rule'));
  if (!unameOk) return showAlert(msg, t('username_taken'));
  if (emailKnownTaken) return showAlert(msg, t('err_email_taken'));
  if ($('#password').value.length < 8) return showAlert(msg, t('err_pw_short'));
  if ($('#password').value !== $('#password2').value) return showAlert(msg, t('err_pw_match'));
  if (!$('#terms').checked) return showAlert(msg, t('err_terms'));

  const btn = $('#submitBtn'); setBusy(btn, true, t('please_wait'));
  const { data, error } = await sb.auth.signUp({
    email: v('email'), password: $('#password').value,
    options: {
      emailRedirectTo: location.origin + '/login.html',
      data: { full_name: v('fullName'), username: v('username'), city: v('city'), country: v('country') }
    }
  });
  if (error) { setBusy(btn, false); return showAlert(msg, friendlyError(error)); }
  // Aynı e-posta zaten kayıtlıysa Supabase sahte başarı döner (identities boş)
  if (data.user && data.user.identities && data.user.identities.length === 0) {
    setBusy(btn, false); return showAlert(msg, t('err_email_taken'));
  }
  if (data.session) { location.href = 'profile.html'; return; }
  $('#formArea').innerHTML = `<div class="alert alert-ok"><b>${t('reg_check_email_t')}</b><br>${t('reg_check_email_d')}</div>
    <a class="btn btn-soft btn-block" href="login.html">${t('nav_login')}</a>`;
});
applyI18n();
</script>
</body></html>
