<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0f1f"><link rel="icon" href="logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/app.css">
<title>Keşfet | Sytraex</title>
<meta name="description" content="Sytraex topluluğunun seyahat deneyimlerini keşfet.">
</head>
<body data-active="explore" data-title="nav_explore">
<div id="site-header"></div>
<main class="container section">
  <div class="section-head"><div><h1 style="font-size:2rem" data-i18n="explore_title"></h1><p id="resultInfo"></p></div></div>
  <form class="searchbar" id="searchForm" style="margin-bottom:28px">
    <div class="field" style="margin:0"><label for="q" data-i18n="search_label_loc"></label><input id="q" type="search" data-i18n-ph="search_ph_loc" autocomplete="off"></div>
    <div class="field" style="margin:0"><label for="dur" data-i18n="search_label_duration"></label><select id="dur"></select></div>
    <div class="field" style="margin:0"><label for="mode" data-i18n="search_label_mode"></label><select id="mode"></select></div>
    <button class="btn btn-primary" type="submit" data-i18n="search_btn_submit"></button>
  </form>
  <div class="grid" id="grid"></div>
  <div class="center mt-lg"><button class="btn btn-soft hidden" id="moreBtn" data-i18n="load_more"></button></div>
</main>
<div id="site-footer"></div>
<script type="module">
import { sb, initPage, $, t, qs, applyI18n, DURATIONS, MODES, durLabel, modeLabel, postCardHTML, skeletons, esc } from './js/app.js';

const PAGE = 12;
let page = 0, total = 0;

function fillFilters() {
  const d = $('#dur'), m = $('#mode'), dv = d.value || qs.get('dur') || '', mv = m.value || qs.get('mode') || '';
  d.innerHTML = `<option value="">${esc(t('search_opt_dur_all'))}</option>` + DURATIONS.map(k => `<option value="${k}">${esc(durLabel(k))}</option>`).join('');
  m.innerHTML = `<option value="">${esc(t('search_opt_mode_all'))}</option>` + MODES.map(k => `<option value="${k}">${esc(modeLabel(k))}</option>`).join('');
  d.value = dv; m.value = mv;
}

async function run(reset = true) {
  if (reset) { page = 0; $('#grid').innerHTML = skeletons(6); }
  const q = $('#q').value.trim().replace(/[%,()]/g, ' ');
  let query = sb.from('posts_feed').select('*', { count: 'exact' });
  if (q) query = query.or(`location.ilike.%${q}%,title.ilike.%${q}%`);
  if ($('#dur').value) query = query.eq('duration', $('#dur').value);
  if ($('#mode').value) query = query.eq('mode', $('#mode').value);
  const { data, count, error } = await query.order('created_at', { ascending: false }).range(page * PAGE, page * PAGE + PAGE - 1);
  if (error) { $('#grid').innerHTML = `<div class="empty" style="grid-column:1/-1"><h3>${esc(t('load_error'))}</h3></div>`; return; }
  total = count || 0;
  if (reset) $('#grid').innerHTML = '';
  if (!data.length && reset) {
    $('#grid').innerHTML = `<div class="empty" style="grid-column:1/-1"><h3>${esc(t('no_results_t'))}</h3><p>${esc(t('no_results_d'))}</p><a class="btn btn-primary" href="share-experience.html">${esc(t('hero_btn_share'))}</a></div>`;
  } else {
    $('#grid').insertAdjacentHTML('beforeend', data.map(postCardHTML).join(''));
  }
  $('#resultInfo').textContent = t('results_count', { n: total });
  $('#moreBtn').classList.toggle('hidden', (page + 1) * PAGE >= total);
}

$('#searchForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const p = new URLSearchParams();
  if ($('#q').value.trim()) p.set('q', $('#q').value.trim());
  if ($('#dur').value) p.set('dur', $('#dur').value);
  if ($('#mode').value) p.set('mode', $('#mode').value);
  history.replaceState(null, '', '?' + p);
  run();
});
$('#moreBtn').onclick = () => { page++; run(false); };

await initPage();
$('#q').value = qs.get('q') || '';
fillFilters(); applyI18n(); run();
window.addEventListener('langchange', () => { fillFilters(); run(); });
</script>
</body></html>
