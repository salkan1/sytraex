<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0f1f"><link rel="icon" href="logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/app.css">
<title>Şifremi Unuttum | Sytraex</title>
<meta name="robots" content="noindex">
</head>
<body data-active="login" data-title="forgot_title">
<div id="site-header"></div>
<main class="container auth-wrap">
  <div class="card narrow">
    <h1 data-i18n="forgot_title"></h1>
    <p class="sub" data-i18n="forgot_sub"></p>
    <div id="msg" class="alert hidden" role="alert"></div>
    <form id="f" novalidate>
      <div class="field"><label for="email" data-i18n="label_email"></label><input id="email" type="email" autocomplete="email" required placeholder="ornek@gmail.com"></div>
      <button class="btn btn-primary btn-block" id="btn" type="submit" data-i18n="forgot_btn"></button>
    </form>
    <p class="center mt"><a href="login.html" data-i18n="back_to_login"></a></p>
  </div>
</main>
<div id="site-footer"></div>
<script type="module">
import { sb, initPage, $, t, setBusy, showAlert, hideAlert, friendlyError } from './js/app.js';
await initPage();
$('#f').addEventListener('submit', async (e) => {
  e.preventDefault(); hideAlert($('#msg'));
  const email = $('#email').value.trim();
  if (!email) return showAlert($('#msg'), t('err_fill_all'));
  setBusy($('#btn'), true, t('please_wait'));
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/reset-password.html' });
  setBusy($('#btn'), false);
  if (error) return showAlert($('#msg'), friendlyError(error));
  // Hesap var/yok bilgisini sızdırmamak için her zaman aynı mesaj
  showAlert($('#msg'), t('forgot_sent'), 'ok');
});
</script>
</body></html>
