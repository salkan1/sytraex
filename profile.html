<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profilim | Sytraex</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    header {
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-img { width: 45px; height: 45px; }
    .logo-text h1 { margin: 0; font-size: 22px; color: #ffcc00; text-transform: lowercase; }
    .logo-text p { margin: 0; font-size: 11px; color: #aaa; }

    nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 20px; }
    nav ul li a { color: #fff; text-decoration: none; font-weight: 500; }
    nav ul li a:hover { color: #ffcc00; }

    .profile-layout {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 30px;
    }

    @media (max-width: 800px) {
      .profile-layout { grid-template-columns: 1fr; }
    }

    /* Sol Menü */
    .sidebar-card {
      background: #1e293b;
      border-radius: 16px;
      padding: 25px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 15px;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ffcc00;
    }

    .username-tag { color: #aaa; font-size: 14px; margin-bottom: 25px; }

    .menu-btn {
      width: 100%;
      padding: 12px 15px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      border-radius: 8px;
      text-align: left;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: 0.3s;
    }

    .menu-btn.active, .menu-btn:hover {
      background: rgba(255, 204, 0, 0.15);
      border-color: #ffcc00;
      color: #ffcc00;
      font-weight: bold;
    }

    .btn-logout {
      width: 100%;
      padding: 12px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #ef4444;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.3s;
    }

    .btn-logout:hover { background: #ef4444; color: #fff; }

    /* Sağ İçerik */
    .content-card {
      background: #1e293b;
      border-radius: 16px;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .content-card h2 { color: #ffcc00; margin-top: 0; margin-bottom: 25px; font-size: 22px; }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .info-box {
      background: #0f172a;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .info-box label { display: block; font-size: 11px; color: #aaa; text-transform: uppercase; margin-bottom: 4px; }
    .info-box span { font-size: 14px; font-weight: bold; color: #fff; }

    /* Gönderi Kartları Mimarisi */
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .post-card {
      background: #0f172a;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .post-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }

    .post-card-body { padding: 15px; }
    .post-card-tag { font-size: 10px; background: rgba(255,204,0,0.2); color: #ffcc00; padding: 2px 6px; border-radius: 4px; }
    .post-card-title { font-size: 15px; font-weight: bold; margin: 8px 0 4px 0; color: #fff; }
    .post-card-loc { font-size: 12px; color: #aaa; margin-bottom: 10px; }

    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      color: #888;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <img src="logo.png" alt="Sytraex Logo" class="logo-img">
      <div class="logo-text">
        <h1>sytraex</h1>
        <p>Share Your Travel Experience</p>
      </div>
    </div>

    <nav>
      <ul>
        <li><a href="index.html">Ana Sayfa</a></li>
        <li><a href="profile.html" style="color:#ffcc00; font-weight:bold;">Profilim</a></li>
        <li><a href="whitepaper.html">White Paper (Stake SYTX)</a></li>
      </ul>
    </nav>
  </header>

  <div class="profile-layout">
    
    <!-- Sol Profil Menüsü -->
    <div class="sidebar-card">
      <div class="avatar-wrapper">
        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200" alt="Profil Fotoğrafı" class="avatar-img" id="userAvatar">
      </div>
      <h3 id="sidebarName" style="margin:0; color:#fff;">Yükleniyor...</h3>
      <div class="username-tag" id="sidebarUsername">@...</div>

      <button class="menu-btn active" id="btnInfo" onclick="switchTab('info')">👤 Profil Bilgileri</button>
      <button class="menu-btn" id="btnPosts" onclick="switchTab('posts')">📝 Gönderilerim</button>

      <a href="share-experience.html" style="text-decoration:none;">
        <button class="menu-btn" style="border-color:#ffcc00; color:#ffcc00; margin-top:10px;">➕ Yeni Deneyim Paylaş</button>
      </a>

      <button class="btn-logout" onclick="logout()">Çıkış Yap</button>
    </div>

    <!-- Sağ Dinamik İçerik Alanı -->
    <div class="content-card">
      
      <!-- TAB 1: Profil Bilgileri -->
      <div id="tabInfo">
        <h2>Profil Bilgilerim</h2>
        <div class="info-grid">
          <div class="info-box"><label>Kullanıcı Adı</label><span id="infoUsername">-</span></div>
          <div class="info-box"><label>Ad Soyad</label><span id="infoName">-</span></div>
          <div class="info-box"><label>E-Posta Adresi</label><span id="infoEmail">-</span></div>
          <div class="info-box"><label>Ülke</label><span id="infoCountry">-</span></div>
          <div class="info-box"><label>İl / Şehir</label><span id="infoCity">-</span></div>
          <div class="info-box"><label>Doğum Tarihi</label><span id="infoBirth">-</span></div>
        </div>
      </div>

      <!-- TAB 2: Kullanıcının Paylaştığı Gönderiler -->
      <div id="tabPosts" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
          <h2 style="margin:0;">Paylaştığım Seyahat Deneyimleri</h2>
          <a href="share-experience.html" style="text-decoration:none;"><button style="padding:8px 16px; background:#ffcc00; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">+ Yeni Ekle</button></a>
        </div>

        <div id="userPostsContainer" class="posts-grid">
          <p style="color:#aaa;">Gönderileriniz yükleniyor...</p>
        </div>
      </div>

    </div>

  </div>

  <footer>
    <p>© 2026 Sytraex | Share Your Travel Experience</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA3pn_ZBSVVxperBuDSMJMrZ-bEt391J6E",
      authDomain: "sytraex-462b0.firebaseapp.com",
      projectId: "sytraex-462b0",
      storageBucket: "sytraex-462b0.firebasestorage.app",
      messagingSenderId: "379245018695",
      appId: "1:379245018695:web:0beff2afb3210a2f6cbb62"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Oturum Kontrolü
    const userData = JSON.parse(localStorage.getItem('sytraexUser'));
    if (!userData) {
      window.location.href = "login.html";
    }

    // Profil Bilgilerini Ekrana Yazma
    document.getElementById('sidebarName').innerText = userData.name || userData.username;
    document.getElementById('sidebarUsername').innerText = `@${userData.username}`;
    document.getElementById('infoUsername').innerText = userData.username;
    document.getElementById('infoName').innerText = userData.name || '-';
    document.getElementById('infoEmail').innerText = userData.email;
    document.getElementById('infoCountry').innerText = userData.country || '-';
    document.getElementById('infoCity').innerText = userData.city || '-';
    document.getElementById('infoBirth').innerText = userData.birth || '-';

    // Tab Geçiş Mantığı
    window.switchTab = function(tabName) {
      const tabInfo = document.getElementById('tabInfo');
      const tabPosts = document.getElementById('tabPosts');
      const btnInfo = document.getElementById('btnInfo');
      const btnPosts = document.getElementById('btnPosts');

      if (tabName === 'posts') {
        tabInfo.style.display = 'none';
        tabPosts.style.display = 'block';
        btnInfo.classList.remove('active');
        btnPosts.classList.add('active');
        loadUserPosts();
      } else {
        tabInfo.style.display = 'block';
        tabPosts.style.display = 'none';
        btnInfo.classList.add('active');
        btnPosts.classList.remove('active');
      }
    };

    // URL'den tab parametresi gelmişse otomatik yönlendir
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('tab') === 'posts') {
      window.switchTab('posts');
    }

    // Kullanıcının Gönderilerini Firestore'dan Çekme
    async function loadUserPosts() {
      const container = document.getElementById('userPostsContainer');
      container.innerHTML = '<p style="color:#aaa;">Gönderileriniz yükleniyor...</p>';

      try {
        const q = query(collection(db, "posts"), where("username", "==", userData.username));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          container.innerHTML = `
            <div style="grid-column: 1/-1; text-align:center; padding:30px; background:#0f172a; border-radius:12px; border:1px dashed rgba(255,255,255,0.1);">
              <p style="color:#aaa; margin-bottom:15px;">Henüz paylaştığınız bir seyahat deneyimi bulunmuyor.</p>
              <a href="share-experience.html" style="text-decoration:none;"><button style="padding:10px 20px; background:#ffcc00; color:#000; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">➕ İlk Deneyimi Paylaş</button></a>
            </div>
          `;
          return;
        }

        container.innerHTML = '';
        querySnapshot.forEach((doc) => {
          const post = doc.data();
          const card = document.createElement('div');
          card.className = 'post-card';

          card.innerHTML = `
            <img src="${post.imageUrl}" alt="${post.title}" onerror="this.src='https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=500'">
            <div class="post-card-body">
              <span class="post-card-tag">${post.mode || 'Seyahat'}</span>
              <div class="post-card-title">${post.title}</div>
              <div class="post-card-loc">📍 ${post.location} • ⏱️ ${post.duration}</div>
            </div>
          `;
          container.appendChild(card);
        });

      } catch (err) {
        console.error("Gönderiler yüklenirken hata:", err);
        container.innerHTML = '<p style="color:#ff4d4d;">Gönderiler çekilirken bir hata oluştu.</p>';
      }
    }

    // Çıkış Yap
    window.logout = function() {
      localStorage.removeItem('loggedIn');
      localStorage.removeItem('sytraexUser');
      window.location.href = "login.html";
    };
  </script>

</body>
</html>
