<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0f1f"><link rel="icon" href="logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/app.css">
<title>Profilim | Sytraex</title>
<meta name="robots" content="noindex">
</head>
<body data-active="profile" data-title="nav_profile">
<div id="site-header"></div>
<main class="container">
  <div class="profile-layout">
    <aside class="side">
      <label style="cursor:pointer;display:block" title="">
        <img class="avatar-xl" id="avatarImg" alt="">
        <input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        <span class="btn btn-soft btn-sm btn-block" data-i18n="change_photo"></span>
      </label>
      <h2 id="sideName" class="mt"></h2>
      <div class="handle" id="sideHandle"></div>
      <a class="btn btn-ghost btn-sm btn-block" id="publicLink" href="#" data-i18n="view_public"></a>
      <nav class="tabs" role="tablist">
        <button class="tab" data-tab="info" role="tab">👤 <span data-i18n="tab_info"></span></button>
        <button class="tab" data-tab="wallet" role="tab">🪙 <span data-i18n="tab_wallet"></span></button>
        <button class="tab" data-tab="posts" role="tab">📝 <span data-i18n="tab_posts"></span></button>
        <button class="tab" data-tab="messages" role="tab">💬 <span data-i18n="tab_messages"></span><span class="count hidden" id="reqBadge"></span></button>
        <a class="tab" href="share-experience.html" style="border-color:var(--gold);color:var(--gold)">➕ <span data-i18n="tab_new"></span></a>
        <button class="tab" id="logoutBtn" style="color:var(--err);border-color:rgba(255,107,107,.4)">⎋ <span data-i18n="nav_logout"></span></button>
      </nav>
    </aside>

    <section>
      <!-- BİLGİLER -->
      <div class="panel" id="p-info">
        <div class="panel-head"><h2 data-i18n="info_title"></h2><button class="btn btn-ghost btn-sm" id="editToggle" data-i18n="edit_info"></button></div>
        <div id="infoMsg" class="alert hidden" role="alert"></div>
        <div id="infoView" class="info-grid"></div>
        <form id="infoForm" class="hidden" novalidate>
          <div class="row">
            <div class="field"><label for="fFull" data-i18n="label_fullname"></label><input id="fFull" type="text" maxlength="80"></div>
            <div class="field"><label for="fUser" data-i18n="label_username"></label><input id="fUser" type="text" maxlength="24" autocapitalize="none"><span class="hint" data-i18n="username_rule"></span></div>
          </div>
          <div class="row">
            <div class="field"><label for="fCity" data-i18n="label_city"></label><input id="fCity" type="text" maxlength="80"></div>
            <div class="field"><label for="fCountry" data-i18n="label_country"></label><input id="fCountry" type="text" maxlength="80"></div>
          </div>
          <div class="field"><label for="fBio" data-i18n="label_bio"></label><textarea id="fBio" maxlength="300" style="min-height:80px" data-i18n-ph="ph_bio"></textarea></div>
          <div style="display:flex;gap:10px"><button class="btn btn-primary" id="saveInfo" type="submit" data-i18n="btn_save"></button><button type="button" class="btn btn-soft" id="cancelEdit" data-i18n="cancel"></button></div>
        </form>

        <div class="form-section" data-i18n="security_title"></div>
        <div class="info-grid" id="secInfo"></div>
        <form id="pwForm" class="mt" novalidate>
          <div class="row">
            <div class="field"><label for="pw1" data-i18n="label_new_password"></label><input id="pw1" type="password" autocomplete="new-password" minlength="8"></div>
            <div class="field"><label for="pw2" data-i18n="label_password2"></label><input id="pw2" type="password" autocomplete="new-password"></div>
          </div>
          <button class="btn btn-soft btn-sm" id="pwBtn" type="submit" data-i18n="change_password"></button>
        </form>

        <div class="danger-zone">
          <h3 data-i18n="danger_title"></h3>
          <p data-i18n="danger_desc"></p>
          <button class="btn btn-danger btn-sm mt" id="delAccount" data-i18n="delete_account"></button>
        </div>
      </div>

      <!-- CÜZDAN -->
      <div class="panel hidden" id="p-wallet">
        <h2 data-i18n="wallet_title"></h2>
        <div class="wallet">
          <div><div class="bal"><span id="balance">0</span> <small>SYTX</small></div><p data-i18n="wallet_sub_label"></p></div>
          <button class="btn btn-primary" disabled data-i18n="wallet_stake_soon"></button>
        </div>
        <div class="alert alert-info" data-i18n="wallet_disclaimer"></div>
        <h3 class="mt" data-i18n="wallet_history_title"></h3>
        <table class="tx"><thead><tr><th data-i18n="tx_type"></th><th data-i18n="tx_desc"></th><th data-i18n="tx_amount"></th></tr></thead><tbody id="txBody"></tbody></table>
        <p class="hint mt" data-i18n="wallet_rules"></p>
      </div>

      <!-- GÖNDERİLERİM -->
      <div class="panel hidden" id="p-posts">
        <div class="panel-head"><h2 data-i18n="my_posts_title"></h2><a class="btn btn-primary btn-sm" href="share-experience.html" data-i18n="tab_new"></a></div>
        <div id="myPosts"></div>
      </div>

      <!-- MESAJLAR -->
      <div class="panel hidden" id="p-messages">
        <h2 data-i18n="msg_title"></h2>
        <h3 data-i18n="msg_requests"></h3>
        <div id="reqList" class="mt"></div>
        <h3 class="mt-lg" data-i18n="msg_active"></h3>
        <div class="msg-grid mt">
          <div class="chat-list" id="chatList"></div>
          <div class="chat-box" id="chatBox"><div class="empty" style="border:0"><p data-i18n="msg_select"></p></div></div>
        </div>
      </div>
    </section>
  </div>
</main>
<div id="site-footer"></div>
<script type="module">
import { sb, state, initPage, $, $$, t, qs, esc, applyI18n, setBusy, showAlert, hideAlert, friendlyError, toast, modal, signOut, avatarSrc, safeImg, fmtDate, fmtTime, compressImage, uploadImage, removeImages, postCardHTML, modeLabel, durLabel, attachCityAutocomplete, attachCountryAutocomplete } from './js/app.js';

await initPage({ requireLogin: true });
if (!state.user) await new Promise(() => {});
attachCityAutocomplete($('#fCity'), { fillMode: 'short' });
attachCountryAutocomplete($('#fCountry'));
const uid = state.user.id;
let profile = state.profile;
let activeTab = 'info';
let chats = [], activeChat = null, channel = null;

// ---------- sekmeler ----------
function switchTab(tab) {
  activeTab = tab;
  ['info', 'wallet', 'posts', 'messages'].forEach(k => $('#p-' + k).classList.toggle('hidden', k !== tab));
  $$('.tab[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  history.replaceState(null, '', '?tab=' + tab);
  if (tab === 'wallet') loadWallet();
  if (tab === 'posts') loadMyPosts();
  if (tab === 'messages') loadMessages();
}
$$('.tab[data-tab]').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
$('#logoutBtn').onclick = signOut;

// ---------- bilgiler ----------
function paintSide() {
  const name = profile?.full_name || profile?.username || '';
  $('#avatarImg').src = avatarSrc(profile?.avatar_url, name);
  $('#sideName').textContent = name;
  $('#sideHandle').textContent = '@' + (profile?.username || '');
  $('#publicLink').href = 'public-profile.html?u=' + encodeURIComponent(profile?.username || '');
}
function paintInfo() {
  const p = profile || {};
  const item = (k, v) => `<div class="info-item"><small>${esc(t(k))}</small><b>${esc(v || '—')}</b></div>`;
  $('#infoView').innerHTML = item('label_fullname', p.full_name) + item('label_username', '@' + p.username) + item('label_city', p.city) + item('label_country', p.country) + item('label_bio', p.bio);
  const providers = (state.user.app_metadata?.providers || [state.user.app_metadata?.provider]).filter(Boolean).map(x => x === 'email' ? t('prov_email') : x[0].toUpperCase() + x.slice(1)).join(', ');
  $('#secInfo').innerHTML = item('label_email', state.user.email) + item('login_method', providers) + item('member_since', fmtDate(state.user.created_at));
}
function setEditing(on) {
  $('#infoView').classList.toggle('hidden', on); $('#infoForm').classList.toggle('hidden', !on); $('#editToggle').classList.toggle('hidden', on);
  if (on) { $('#fFull').value = profile.full_name || ''; $('#fUser').value = profile.username || ''; $('#fCity').value = profile.city || ''; $('#fCountry').value = profile.country || ''; $('#fBio').value = profile.bio || ''; }
}
$('#editToggle').onclick = () => setEditing(true);
$('#cancelEdit').onclick = () => { setEditing(false); hideAlert($('#infoMsg')); };
$('#fUser').addEventListener('input', e => e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9_.]/g, ''));
$('#infoForm').addEventListener('submit', async (e) => {
  e.preventDefault(); hideAlert($('#infoMsg'));
  const username = $('#fUser').value.trim();
  if (!/^[a-z0-9_.]{3,24}$/.test(username)) return showAlert($('#infoMsg'), t('username_rule'));
  const btn = $('#saveInfo'); setBusy(btn, true, t('please_wait'));
  const upd = { full_name: $('#fFull').value.trim() || null, username, city: $('#fCity').value.trim() || null, country: $('#fCountry').value.trim() || null, bio: $('#fBio').value.trim() || null };
  const { data, error } = await sb.from('profiles').update(upd).eq('id', uid).select().single();
  setBusy(btn, false);
  if (error) return showAlert($('#infoMsg'), error.code === '23505' ? t('username_taken') : friendlyError(error));
  profile = data; setEditing(false); paintInfo(); paintSide(); toast(t('saved'), 'ok');
});

$('#avatarFile').onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const blob = await compressImage(f, 512, 0.85, true);
    const url = await uploadImage('avatars', blob);
    const old = profile.avatar_url;
    const { data, error } = await sb.from('profiles').update({ avatar_url: url }).eq('id', uid).select().single();
    if (error) throw error;
    profile = data; paintSide(); toast(t('saved'), 'ok');
    if (old) removeImages('avatars', [old]).catch(() => {});
  } catch (err) { toast(friendlyError(err), 'err'); }
};

$('#pwForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const a = $('#pw1').value, b = $('#pw2').value;
  if (a.length < 8) return toast(t('err_pw_short'), 'err');
  if (a !== b) return toast(t('err_pw_match'), 'err');
  setBusy($('#pwBtn'), true, t('please_wait'));
  const { error } = await sb.auth.updateUser({ password: a });
  setBusy($('#pwBtn'), false);
  if (error) return toast(friendlyError(error), 'err');
  $('#pw1').value = $('#pw2').value = ''; toast(t('password_changed'), 'ok');
});

$('#delAccount').onclick = async () => {
  const ok = await modal({ title: t('delete_account_t'), body: t('delete_account_d'), confirmText: t('delete_account_confirm'), danger: true });
  if (!ok) return;
  try {
    for (const bucket of ['avatars', 'post-images']) {
      const { data } = await sb.storage.from(bucket).list(uid, { limit: 1000 });
      if (data?.length) await sb.storage.from(bucket).remove(data.map(o => `${uid}/${o.name}`));
    }
    const { error } = await sb.rpc('delete_my_account');
    if (error) throw error;
    await sb.auth.signOut(); location.href = 'index.html?deleted=1';
  } catch (err) { toast(friendlyError(err), 'err'); }
};

// ---------- cüzdan ----------
async function loadWallet() {
  const { data, error } = await sb.from('sytx_ledger').select('*').eq('user_id', uid).order('created_at', { ascending: false });
  if (error) return ($('#txBody').innerHTML = `<tr><td colspan="3">${esc(t('load_error'))}</td></tr>`);
  $('#balance').textContent = data.reduce((s, r) => s + r.amount, 0).toLocaleString();
  $('#txBody').innerHTML = data.length ? data.map(r => `<tr><td>${esc(t('tx_' + r.kind))}</td><td>${esc(r.kind === 'welcome' ? t('tx_welcome_desc') : r.description)}<br><small class="faint">${esc(fmtDate(r.created_at))}</small></td><td class="amt">+${r.amount} SYTX</td></tr>`).join('')
    : `<tr><td colspan="3" class="muted">${esc(t('no_tx'))}</td></tr>`;
}

// ---------- gönderilerim ----------
async function loadMyPosts() {
  const box = $('#myPosts'); box.innerHTML = '<div class="skeleton" style="min-height:90px"></div>';
  const { data, error } = await sb.from('posts_feed').select('*').eq('user_id', uid).order('created_at', { ascending: false });
  if (error) return (box.innerHTML = `<div class="alert alert-err">${esc(t('load_error'))}</div>`);
  if (!data.length) return (box.innerHTML = `<div class="empty"><h3>${esc(t('no_my_posts_t'))}</h3><p>${esc(t('no_my_posts_d'))}</p><a class="btn btn-primary" href="share-experience.html">${esc(t('hero_btn_share'))}</a></div>`);
  box.innerHTML = data.map(p => `<div class="mypost"><img src="${esc(safeImg(p.images?.[0]))}" alt="">
    <div class="info"><b>${esc(p.title)}</b><small class="muted">📍 ${esc(p.location)} · ${esc(fmtDate(p.created_at))} · ${p.votes > 0 ? '★ ' + Number(p.avg_score).toFixed(1) + ' (' + p.votes + ')' : esc(t('no_votes'))}</small></div>
    <div class="acts"><a class="btn btn-soft btn-sm" href="post-detail.html?id=${esc(p.id)}">${esc(t('view'))}</a><a class="btn btn-ghost btn-sm" href="share-experience.html?edit=${esc(p.id)}">${esc(t('edit'))}</a><button class="btn btn-danger btn-sm" data-del="${esc(p.id)}">${esc(t('delete'))}</button></div></div>`).join('');
  $$('[data-del]', box).forEach(b => b.onclick = async () => {
    const post = data.find(x => x.id === b.dataset.del);
    const ok = await modal({ title: t('delete_post_t'), body: t('delete_post_d'), confirmText: t('delete'), danger: true });
    if (!ok) return;
    const { error } = await sb.from('posts').delete().eq('id', post.id);
    if (error) return toast(friendlyError(error), 'err');
    removeImages('post-images', post.images).catch(() => {});
    loadMyPosts();
  });
}

// ---------- mesajlar ----------
const PJOIN = 'id,intro,status,created_at,sender_id,receiver_id,sender:profiles!message_requests_sender_id_fkey(username,full_name,avatar_url),receiver:profiles!message_requests_receiver_id_fkey(username,full_name,avatar_url)';
async function loadMessages() {
  const { data, error } = await sb.from('message_requests').select(PJOIN).in('status', ['pending', 'accepted']).order('created_at', { ascending: false });
  if (error) return toast(t('load_error'), 'err');
  const pending = data.filter(r => r.status === 'pending' && r.receiver_id === uid);
  chats = data.filter(r => r.status === 'accepted');
  $('#reqList').innerHTML = pending.length ? pending.map(r => `<div class="req"><div class="author"><img class="avatar lg" src="${esc(avatarSrc(r.sender?.avatar_url, r.sender?.full_name))}" alt=""><div><b>${esc(r.sender?.full_name || r.sender?.username)}</b> <small>@${esc(r.sender?.username)}</small><small>${esc(r.intro || '')}</small></div></div>
    <div style="display:flex;gap:8px"><button class="btn btn-primary btn-sm" data-ans="accepted" data-id="${esc(r.id)}">${esc(t('accept'))}</button><button class="btn btn-soft btn-sm" data-ans="rejected" data-id="${esc(r.id)}">${esc(t('reject'))}</button></div></div>`).join('')
    : `<p class="muted">${esc(t('msg_no_requests'))}</p>`;
  $$('[data-ans]').forEach(b => b.onclick = async () => {
    const { error } = await sb.from('message_requests').update({ status: b.dataset.ans }).eq('id', b.dataset.id);
    if (error) return toast(friendlyError(error), 'err');
    loadMessages(); refreshBadge();
  });
  $('#chatList').innerHTML = chats.length ? chats.map(c => { const o = other(c); return `<button class="chat-item ${activeChat?.id === c.id ? 'on' : ''}" data-chat="${esc(c.id)}"><img class="avatar lg" style="width:34px;height:34px" src="${esc(avatarSrc(o.avatar_url, o.full_name || o.username))}" alt=""><span>${esc(o.full_name || o.username)}</span></button>`; }).join('')
    : `<p class="muted">${esc(t('msg_no_chats'))}</p>`;
  $$('[data-chat]').forEach(b => b.onclick = () => openChat(chats.find(c => c.id === b.dataset.chat)));
  refreshBadge();
}
const other = (c) => (c.sender_id === uid ? c.receiver : c.sender) || {};
async function refreshBadge() {
  const { count } = await sb.from('message_requests').select('id', { count: 'exact', head: true }).eq('receiver_id', uid).eq('status', 'pending');
  const b = $('#reqBadge'); b.textContent = count || ''; b.classList.toggle('hidden', !count);
}
function bubble(m) {
  return `<div class="bubble ${m.sender_id === uid ? 'me' : ''}" data-mid="${esc(m.id)}">${esc(m.body)}<time>${esc(fmtTime(m.created_at))}</time></div>`;
}
async function openChat(c) {
  activeChat = c;
  $$('.chat-item').forEach(x => x.classList.toggle('on', x.dataset.chat === c.id));
  const o = other(c);
  $('#chatBox').innerHTML = `<div class="chat-head">${esc(o.full_name || o.username)} <small class="muted">@${esc(o.username)}</small></div>
    <div class="chat-msgs" id="msgs"></div>
    <form class="chat-form" id="chatForm"><input id="chatInput" type="text" maxlength="2000" autocomplete="off" placeholder="${esc(t('msg_write'))}"><button class="btn btn-primary" type="submit">${esc(t('send'))}</button></form>`;
  const { data } = await sb.from('messages').select('*').eq('request_id', c.id).order('created_at', { ascending: true }).limit(300);
  const box = $('#msgs'); box.innerHTML = (data || []).map(bubble).join(''); box.scrollTop = box.scrollHeight;
  $('#chatForm').onsubmit = async (e) => {
    e.preventDefault();
    const body = $('#chatInput').value.trim(); if (!body) return;
    $('#chatInput').value = '';
    const { data: m, error } = await sb.from('messages').insert({ request_id: c.id, sender_id: uid, body }).select().single();
    if (error) { $('#chatInput').value = body; return toast(friendlyError(error), 'err'); }
    append(m);
  };
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('chat-' + c.id).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `request_id=eq.${c.id}` }, (p) => append(p.new)).subscribe();
}
function append(m) {
  const box = $('#msgs'); if (!box || box.querySelector(`[data-mid="${m.id}"]`)) return;
  box.insertAdjacentHTML('beforeend', bubble(m)); box.scrollTop = box.scrollHeight;
}

// ---------- başlat ----------
paintSide(); paintInfo(); refreshBadge();
switchTab(['info', 'wallet', 'posts', 'messages'].includes(qs.get('tab')) ? qs.get('tab') : 'info');
applyI18n();
window.addEventListener('langchange', () => { paintInfo(); switchTab(activeTab); });
window.addEventListener('beforeunload', () => { if (channel) sb.removeChannel(channel); });
</script>
</body></html>
