<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0f1f"><link rel="icon" href="logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/app.css">
<title>Yeni Şifre | Sytraex</title>
<meta name="robots" content="noindex">
</head>
<body data-active="login" data-title="reset_title">
<div id="site-header"></div>
<main class="container auth-wrap">
  <div class="card narrow">
    <h1 data-i18n="reset_title"></h1>
    <p class="sub" data-i18n="reset_sub"></p>
    <div id="msg" class="alert hidden" role="alert"></div>
    <form id="f" novalidate>
      <div class="field"><label for="p1" data-i18n="label_new_password"></label><input id="p1" type="password" autocomplete="new-password" minlength="8" required><span class="hint" data-i18n="password_rule"></span></div>
      <div class="field"><label for="p2" data-i18n="label_password2"></label><input id="p2" type="password" autocomplete="new-password" required></div>
      <button class="btn btn-primary btn-block" id="btn" type="submit" data-i18n="reset_btn"></button>
    </form>
  </div>
</main>
<div id="site-footer"></div>
<script type="module">
import { sb, initPage, state, $, t, setBusy, showAlert, hideAlert, friendlyError } from './js/app.js';
await initPage();  // e-postadaki bağlantı PKCE kodunu oturuma çevirir
if (!state.user) showAlert($('#msg'), t('reset_invalid_link'));
$('#f').addEventListener('submit', async (e) => {
  e.preventDefault(); hideAlert($('#msg'));
  if (!state.user) return showAlert($('#msg'), t('reset_invalid_link'));
  const p1 = $('#p1').value;
  if (p1.length < 8) return showAlert($('#msg'), t('err_pw_short'));
  if (p1 !== $('#p2').value) return showAlert($('#msg'), t('err_pw_match'));
  setBusy($('#btn'), true, t('please_wait'));
  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) { setBusy($('#btn'), false); return showAlert($('#msg'), friendlyError(error)); }
  await sb.auth.signOut({ scope: 'others' }).catch(() => {});
  location.href = 'profile.html';
});
</script>
</body></html>
