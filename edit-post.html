<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deneyim Düzenle | Sytraex</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    /* Birebir aynı CSS yapısı */
    body { margin: 0; padding: 0; background-color: #0f172a; color: #ffffff; font-family: Arial, sans-serif; }
    header { background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-img { width: 45px; height: 45px; }
    .logo-text h1 { margin: 0; font-size: 22px; color: #ffcc00; text-transform: lowercase; }
    .logo-text p { margin: 0; font-size: 11px; color: #aaa; }
    nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 20px; align-items: center; }
    nav ul li a { color: #fff; text-decoration: none; font-weight: 500; transition: color 0.3s; }
    nav ul li a:hover { color: #ffcc00; }
    .lang-switcher { font-size: 13px; font-weight: bold; color: #ffcc00; margin-left: 10px; cursor: pointer; }
    .share-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .share-card { background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 204, 0, 0.3); border-radius: 16px; padding: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
    .share-card h2 { color: #ffcc00; margin-top: 0; margin-bottom: 25px; font-size: 26px; text-align: center; }
    .form-group { margin-bottom: 22px; position: relative; }
    .form-group label { display: block; font-size: 13px; color: #ffcc00; margin-bottom: 8px; font-weight: bold; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; background: #0f172a; color: #fff; font-size: 14px; outline: none; box-sizing: border-box; }
    .form-group textarea { resize: vertical; min-height: 90px; }
    .autocomplete-items { position: absolute; border: 1px solid #ffcc00; border-top: none; z-index: 9999; top: 100%; left: 0; right: 0; background-color: #1e293b; border-radius: 0 0 8px 8px; max-height: 220px; overflow-y: auto; display: none; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
    .autocomplete-items div { padding: 12px 15px; cursor: pointer; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center; }
    .autocomplete-items div:hover { background-color: #ffcc00; color: #000; }
    .image-preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; margin-top: 12px; }
    .preview-item { position: relative; width: 100%; height: 90px; border-radius: 8px; overflow: hidden; border: 2px solid rgba(255, 204, 0, 0.4); }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; }
    .preview-item .remove-btn { position: absolute; top: 4px; right: 4px; background: rgba(239, 68, 68, 0.85); color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 12px; display: flex; justify-content: center; align-items: center; font-weight: bold; }
    .preview-item .cover-badge { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(255, 204, 0, 0.9); color: #000; font-size: 9px; font-weight: bold; text-align: center; padding: 2px 0; }
    .btn-upload-photos { display: inline-block; padding: 12px 20px; background: rgba(255, 204, 0, 0.15); border: 1px dashed #ffcc00; color: #ffcc00; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; width: 100%; text-align: center; box-sizing: border-box; }
    .section-divider { border-top: 1px dashed rgba(255, 204, 0, 0.3); margin: 30px 0 25px 0; position: relative; }
    .section-divider-title { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: #1e293b; padding: 0 15px; color: #ffcc00; font-size: 14px; font-weight: bold; }
    .submit-btn { width: 100%; padding: 15px; background: #ffcc00; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
    .delete-btn { width: 100%; padding: 14px; background: transparent; color: #ef4444; border: 2px solid #ef4444; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; transition: 0.3s; }
    .delete-btn:hover { background: #ef4444; color: #fff; }
    footer { text-align: center; padding: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); color: #888; font-size: 13px; margin-top: 60px; }
  </style>
  <script src="lang.js"></script>
</head>
<body>
  <header>
    <div class="logo"><img src="logo.png" alt="Sytraex Logo" class="logo-img"><div class="logo-text"><h1>sytraex</h1><p>Share Your Travel Experience</p></div></div>
    <nav><ul><li><a href="index.html" data-i18n="nav_home">Ana Sayfa</a></li><li><a href="profile.html" style="color:#ffcc00; font-weight:bold;" data-i18n="nav_profile">Profilim</a></li><li><a href="whitepaper.html" data-i18n="nav_whitepaper">White Paper (Stake SYTX)</a></li><li class="lang-switcher">TR / EN</li></ul></nav>
  </header>

  <div class="share-container">
    <div class="share-card">
      <h2 data-i18n="share_title">✏️ Deneyimi Düzenle</h2>
      <form id="editForm" autocomplete="off">
        <div class="form-group"><label for="postTitle" data-i18n="share_label_post_title">Deneyim / Rota Başlığı:</label><input type="text" id="postTitle" required></div>
        <div class="form-group"><label for="locationInput" data-i18n="share_label_loc">Nereye Seyahat Edildi?</label><input type="text" id="locationInput" required><div id="cityAutocompleteList" class="autocomplete-items"></div></div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="form-group"><label for="postDuration" data-i18n="share_label_duration">Süre:</label><select id="postDuration"><option value="3 Saatlik Tur">3 Saatlik Hızlı Tur</option><option value="Günübirlik (6-12 Saat)">Günübirlik</option><option value="1 Gün">Tam 1 Gün</option><option value="Hafta Sonu (2-3 Gün)">Hafta Sonu</option><option value="1 Hafta veya Daha Uzun">1 Hafta+</option></select></div>
          <div class="form-group"><label for="postMode" data-i18n="share_label_mode">Seyahat Modu:</label><select id="postMode"><option value="🌙 Gece Hayatı & Eğlence">🌙 Gece Hayatı</option><option value="☀️ Gündüz Gezi & Şehir">☀️ Gündüz Gezi</option><option value="🏛️ Tarihsel & Kültür">🏛️ Tarihsel</option><option value="🌿 Doğa & Sakinlik">🌿 Doğa</option><option value="🍕 Yemek & Gastronomi">🍕 Yemek</option><option value="🏄 Macera & Spor">🏄 Macera</option><option value="💰 Bütçe Dostu">💰 Bütçe</option></select></div>
        </div>
        <div class="section-divider"><span class="section-divider-title" data-i18n="share_divider_media">🖼️ Medya</span></div>
        <div class="form-group"><label>Fotoğraflar:</label><label for="filePhotoInput" class="btn-upload-photos">📷 Fotoğraf Seç</label><input type="file" id="filePhotoInput" accept="image/*" multiple style="display:none;"><div id="imagePreviewGrid" class="image-preview-grid"></div></div>
        <div class="form-group"><label for="youtubeUrl" data-i18n="share_label_youtube">🎥 YouTube Video Bağlantısı:</label><input type="url" id="youtubeUrl"></div>
        <div class="section-divider"><span class="section-divider-title" data-i18n="share_divider_details">📝 Detaylar</span></div>
        <div class="form-group"><label for="summaryContent" data-i18n="share_label_summary">📌 Genel Özet:</label><textarea id="summaryContent" required></textarea></div>
        <div class="form-group"><label for="sightseeingContent" data-i18n="share_label_sightseeing">🏛️ Gezilecek Yerler:</label><textarea id="sightseeingContent"></textarea></div>
        <div class="form-group"><label for="stayContent" data-i18n="share_label_stay">🏨 Konaklama:</label><textarea id="stayContent"></textarea></div>
        <div class="form-group"><label for="foodContent" data-i18n="share_label_food">🍕 Yeme & İçme:</label><textarea id="foodContent"></textarea></div>
        <div class="form-group"><label for="tipsContent" data-i18n="share_label_tips">🚌 Tüyolar:</label><textarea id="tipsContent"></textarea></div>
        <button type="submit" id="submitBtn" class="submit-btn">💾 Değişiklikleri Kaydet</button>
        <button type="button" id="deleteBtn" class="delete-btn">🗑️ Gönderiyi Sil</button>
      </form>
    </div>
  </div>
  <footer><p>© 2026 Sytraex | Share Your Travel Experience</p></footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    const db = getFirestore(initializeApp({ apiKey: "AIzaSyA3pn_ZBSVVxperBuDSMJMrZ-bEt391J6E", authDomain: "sytraex-462b0.firebaseapp.com", projectId: "sytraex-462b0", storageBucket: "sytraex-462b0.firebasestorage.app", messagingSenderId: "379245018695", appId: "1:379245018695:web:0beff2afb3210a2f6cbb62" }));
    const postId = new URLSearchParams(window.location.search).get('postId');
    let uploadedBase64Images = [];

    async function loadData() {
      const docSnap = await getDoc(doc(db, "posts", postId));
      if (docSnap.exists()) {
        const d = docSnap.data();
        document.getElementById('postTitle').value = d.title || "";
        document.getElementById('locationInput').value = d.location || "";
        document.getElementById('postDuration').value = d.duration || "";
        document.getElementById('postMode').value = d.mode || "";
        document.getElementById('summaryContent').value = d.details?.summary || "";
        document.getElementById('sightseeingContent').value = d.details?.sightseeing || "";
        document.getElementById('stayContent').value = d.details?.stay || "";
        document.getElementById('foodContent').value = d.details?.food || "";
        document.getElementById('tipsContent').value = d.details?.tips || "";
        document.getElementById('youtubeUrl').value = d.youtubeUrl || "";
        uploadedBase64Images = d.images || [];
        renderPreviews();
      }
    }

    const locationInput = document.getElementById("locationInput");
    const cityList = document.getElementById("cityAutocompleteList");
    locationInput.addEventListener("input", function() {
      const q = this.value.trim();
      if(q.length < 2) { cityList.style.display = "none"; return; }
      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&addressdetails=1&limit=8`)
      .then(res => res.json()).then(data => {
        cityList.innerHTML = "";
        data.forEach(item => {
          const div = document.createElement("div");
          const n = item.address.district || item.address.city || item.display_name.split(',')[0];
          div.innerHTML = `<span>📍 <strong>${n}</strong></span> <span style="font-size:11px;">(${item.address.country || ''})</span>`;
          div.onclick = () => { locationInput.value = item.display_name; cityList.style.display = "none"; };
          cityList.appendChild(div);
        });
        cityList.style.display = "block";
      });
    });

    document.getElementById('filePhotoInput').addEventListener('change', function(e) {
      Array.from(e.target.files).forEach(f => {
        const reader = new FileReader();
        reader.onload = (ev) => { uploadedBase64Images.push(ev.target.result); renderPreviews(); };
        reader.readAsDataURL(f);
      });
    });

    function renderPreviews() {
      const grid = document.getElementById('imagePreviewGrid'); grid.innerHTML = '';
      const bText = (localStorage.getItem('sytraexLang') === 'en') ? 'COVER' : 'KAPAK';
      uploadedBase64Images.forEach((img, idx) => {
        const item = document.createElement('div'); item.className = 'preview-item';
        item.innerHTML = `<img src="${img}"><button type="button" class="remove-btn" onclick="removeImage(${idx})">✕</button>${idx === 0 ? `<span class="cover-badge">${bText}</span>` : ''}`;
        grid.appendChild(item);
      });
    }
    window.removeImage = (idx) => { uploadedBase64Images.splice(idx, 1); renderPreviews(); };

    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await updateDoc(doc(db, "posts", postId), {
        title: document.getElementById('postTitle').value,
        location: document.getElementById('locationInput').value,
        duration: document.getElementById('postDuration').value,
        mode: document.getElementById('postMode').value,
        images: uploadedBase64Images,
        youtubeUrl: document.getElementById('youtubeUrl').value,
        details: { summary: document.getElementById('summaryContent').value, sightseeing: document.getElementById('sightseeingContent').value, stay: document.getElementById('stayContent').value, food: document.getElementById('foodContent').value, tips: document.getElementById('tipsContent').value }
      });
      alert("Başarıyla güncellendi!");
      window.location.href = "profile.html?tab=posts";
    });

    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if(confirm("Silmek istediğine emin misin?")){ await deleteDoc(doc(db, "posts", postId)); window.location.href="profile.html"; }
    });
    
    loadData();
  </script>
</body>
</html>
