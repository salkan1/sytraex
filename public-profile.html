<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0f1f"><link rel="icon" href="logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/app.css">
<title>Gezgin Profili | Sytraex</title>
</head>
<body data-active="explore">
<div id="site-header"></div>
<main class="container section" id="root"><div class="skeleton" style="min-height:220px"></div></main>
<div id="site-footer"></div>
<script type="module">
import { sb, state, initPage, $, t, qs, esc, applyI18n, avatarSrc, fmtDate, postCardHTML, toast, modal, friendlyError, skeletons } from './js/app.js';

const uname = (qs.get('u') || '').toLowerCase();
let prof = null, reqRow = null;
await initPage();
if (!/^[a-z0-9_.]{3,24}$/.test(uname)) fail(); else await load();

function fail() {
  $('#root').innerHTML = `<div class="empty"><h3>${esc(t('user_not_found'))}</h3><a class="btn btn-primary" href="search-results.html">${esc(t('nav_explore'))}</a></div>`;
}
async function load() {
  const { data, error } = await sb.from('profiles').select('*').eq('username', uname).maybeSingle();
  if (error || !data) return fail();
  prof = data;
  document.title = `${prof.full_name || prof.username} | Sytraex`;
  if (state.user && state.user.id !== prof.id) {
    const { data: r } = await sb.from('message_requests').select('id,status,sender_id,created_at')
      .or(`and(sender_id.eq.${state.user.id},receiver_id.eq.${prof.id}),and(sender_id.eq.${prof.id},receiver_id.eq.${state.user.id})`).order('created_at',{ascending:false}).limit(1).maybeSingle();
    reqRow = r;
  }
  render();
  const { data: posts } = await sb.from('posts_feed').select('*').eq('user_id', prof.id).order('created_at', { ascending: false });
  $('#userPosts').innerHTML = posts?.length ? posts.map(postCardHTML).join('') : `<div class="empty" style="grid-column:1/-1"><p>${esc(t('user_no_posts'))}</p></div>`;
  $('#postCount').textContent = posts?.length || 0;
}
function actionHTML() {
  if (!state.user) return `<a class="btn btn-primary" href="login.html?next=${encodeURIComponent('public-profile.html?u=' + uname)}">${esc(t('msg_login_to_send'))}</a>`;
  if (state.user.id === prof.id) return `<a class="btn btn-ghost" href="profile.html">${esc(t('nav_profile'))}</a>`;
  if (!reqRow) return `<button class="btn btn-primary" id="reqBtn">💬 ${esc(t('msg_send_request'))}</button>`;
  if (reqRow.status === 'accepted') return `<a class="btn btn-primary" href="profile.html?tab=messages">💬 ${esc(t('msg_open_chat'))}</a>`;
  if (reqRow.status === 'pending') return `<button class="btn btn-soft" disabled>⏳ ${esc(reqRow.sender_id === state.user.id ? t('msg_request_pending') : t('msg_request_incoming'))}</button>`;
  // reddedilen istek: yalnızca BEN gönderip reddedildiysem ve 30 gün dolmadıysa engelli kalır
  const COOLDOWN_MS = 30 * 24 * 60 * 60 * 1000;
  const iWasSender = reqRow.sender_id === state.user.id;
  const stillCoolingDown = iWasSender && (Date.now() - new Date(reqRow.created_at).getTime()) < COOLDOWN_MS;
  if (stillCoolingDown) return `<button class="btn btn-soft" disabled>${esc(t('msg_request_rejected'))}</button>`;
  return `<button class="btn btn-primary" id="reqBtn">💬 ${esc(t('msg_send_request'))}</button>`;
}
function render() {
  const name = prof.full_name || prof.username;
  const loc = [prof.city, prof.country].filter(Boolean).join(', ');
  $('#root').innerHTML = `
  <div class="card" style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">
    <img class="avatar-xl" style="width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid var(--gold)" src="${esc(avatarSrc(prof.avatar_url, name))}" alt="">
    <div style="flex:1;min-width:240px"><h1 style="font-size:1.8rem">${esc(name)}</h1><p>@${esc(prof.username)}${loc ? ' · 📍 ' + esc(loc) : ''}</p>
      ${prof.bio ? `<p class="mt" style="color:var(--text)">${esc(prof.bio)}</p>` : ''}
      <p class="hint mt">${esc(t('member_since'))}: ${esc(fmtDate(prof.created_at))} · ${esc(t('tab_posts'))}: <span id="postCount">…</span></p></div>
    <div id="act" style="display:flex;gap:10px;flex-wrap:wrap">${actionHTML()}
      ${state.user && state.user.id !== prof.id ? `<button class="btn btn-soft btn-sm" id="repBtn">⚑ ${esc(t('report'))}</button>` : ''}</div>
  </div>
  <div class="section-head mt-lg"><h2>${esc(t('tab_posts'))}</h2></div>
  <div class="grid" id="userPosts">${skeletons(3)}</div>`;
  const rb = $('#reqBtn'); if (rb) rb.onclick = sendRequest;
  const rp = $('#repBtn'); if (rp) rp.onclick = report;
}
async function sendRequest() {
  const intro = await modal({ title: t('msg_send_request'), body: t('msg_request_desc'), input: { placeholder: t('msg_intro_ph'), max: 300 }, confirmText: t('send') });
  if (intro === null) return;
  const { data, error } = await sb.from('message_requests').insert({ sender_id: state.user.id, receiver_id: prof.id, intro: intro || null }).select('id,status,sender_id').single();
  if (error) return toast(error.code === '23505' ? t('msg_request_exists') : friendlyError(error), 'err');
  reqRow = data; $('#act').innerHTML = actionHTML(); toast(t('msg_request_sent'), 'ok');
}
async function report() {
  const reason = await modal({ title: t('report_title'), body: t('report_desc'), input: { placeholder: t('report_ph'), max: 500 }, confirmText: t('report_send') });
  if (!reason || reason.length < 3) return;
  const { error } = await sb.from('reports').insert({ reporter_id: state.user.id, target_type: 'profile', target_id: prof.id, reason });
  toast(error ? friendlyError(error) : t('report_thanks'), error ? 'err' : 'ok');
}
window.addEventListener('langchange', () => { if (prof) { render(); load(); } });
</script>
</body></html>
