<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seyahat Detayı | Sytraex</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    /* ... (Mevcut stillerin aynı kalabilir, aşağıdakileri ekle/güncelle) ... */
    body { margin: 0; padding: 0; background-color: #0f172a; color: #ffffff; font-family: Arial, sans-serif; }
    /* ... (CSS kısmını olduğu gibi bırak, sadece aşağıdakileri ekle) ... */
    .btn-edit { padding: 8px 16px; background: rgba(255, 204, 0, 0.15); border: 1px solid #ffcc00; color: #ffcc00; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; }
    .btn-del { padding: 8px 16px; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ef4444; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; margin-left: 10px; }
  </style>
  <script src="lang.js"></script>
</head>
<body>
  
  <header>
    <!-- ... (Header aynı kalabilir) ... -->
  </header>

  <div class="detail-container">
    <div class="post-header-card">
      <h1 class="post-title" id="postTitle">Yükleniyor...</h1>
      
      <!-- DÜZENLEME VE SİLME BUTONLARI BURAYA EKLENDİ -->
      <div id="authorActions" style="display:none; margin-bottom: 20px;">
        <button onclick="editPost()" class="btn-edit" data-i18n="detail_btn_edit">✏️ Gönderiyi Düzenle</button>
        <button onclick="deletePost()" class="btn-del" data-i18n="detail_btn_delete">🗑️ Gönderiyi Sil</button>
      </div>

      <div class="author-bar">
        <div class="author-info" id="authorCard">
          <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200" class="author-avatar" id="authorAvatar">
          <div>
            <div class="author-name" id="authorName">-</div>
            <div class="author-username" id="authorUsername">@...</div>
          </div>
        </div>
        <div class="post-badges" id="postBadges"></div>
      </div>
    </div>

    <!-- ... (Fotoğraf, Video ve Yorumlar bölümleri aynı kalacak) ... -->
    <div class="gallery-container" id="galleryWrapper">
      <img src="" class="main-image" id="mainImage">
      <div class="thumbnails-grid" id="thumbnailsGrid"></div>
    </div>
    <div id="videoContainer" style="display:none;"></div>
    <div class="content-card" id="detailsCard"></div>
    <!-- ... -->
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, deleteDoc, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    // Firebase Config (Aynı)
    const firebaseConfig = { /* ... */ };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const currentUser = JSON.parse(localStorage.getItem('sytraexUser'));
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');

    async function loadPostDetail() {
        // ... (Mevcut yükleme mantığı) ...
        
        // Yazar kontrolü (Silme/Düzenleme görünürlüğü)
        if (currentUser && postData.username === currentUser.username) {
            document.getElementById('authorActions').style.display = 'block';
        }
    }

    // YENİ FONKSİYONLAR
    window.editPost = function() {
        // Düzenleme sayfası için yönlendirme (edit-post.html oluşturabilirsin)
        window.location.href = `edit-post.html?id=${postId}`;
    };

    window.deletePost = async function() {
        if (confirm("Bu gönderiyi silmek istediğinize emin misiniz?")) {
            try {
                await deleteDoc(doc(db, "posts", postId));
                alert("Gönderi silindi.");
                window.location.href = "profile.html?tab=posts";
            } catch (e) {
                alert("Silme hatası: " + e.message);
            }
        }
    };

    loadPostDetail();
  </script>
</body>
</html>
