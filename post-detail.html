<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0f1f"><link rel="icon" href="logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/app.css">
<title>Seyahat Deneyimi | Sytraex</title>
</head>
<body data-active="explore">
<div id="site-header"></div>
<main class="container detail" id="root"><div class="skeleton" style="min-height:420px"></div></main>
<div id="site-footer"></div>
<script type="module">
import { sb, state, initPage, $, $$, t, qs, esc, applyI18n, avatarSrc, safeImg, modeLabel, durLabel, fmtDate, youtubeEmbed, toast, modal, friendlyError, removeImages } from './js/app.js';

const id = qs.get('id');
let post = null, myScore = 0;

await initPage();
if (!id || !/^[0-9a-f-]{36}$/i.test(id)) { fail(); } else { await load(); }

function fail() {
  $('#root').innerHTML = `<div class="empty"><h3>${esc(t('post_not_found'))}</h3><a class="btn btn-primary" href="search-results.html">${esc(t('nav_explore'))}</a></div>`;
}

async function load() {
  const { data, error } = await sb.from('posts_feed').select('*').eq('id', id).maybeSingle();
  if (error || !data) return fail();
  post = data;
  document.title = `${post.title} | Sytraex`;
  if (state.user) {
    const r = await sb.from('post_ratings').select('score').eq('post_id', id).eq('user_id', state.user.id).maybeSingle();
    myScore = r.data?.score || 0;
  }
  render(); loadComments();
}

function render() {
  const p = post, mine = state.user?.id === p.user_id;
  const imgs = (p.images || []).map(safeImg);
  const embed = youtubeEmbed(p.youtube_url);
  const sections = [['detail_sec_summary', p.summary], ['detail_sec_sightseeing', p.sightseeing], ['detail_sec_stay', p.stay], ['detail_sec_food', p.food], ['detail_sec_tips', p.tips]]
    .filter(([, txt]) => txt && txt.trim())
    .map(([k, txt]) => `<div class="section-block"><h3>${esc(t(k))}</h3><p>${esc(txt)}</p></div>`).join('');
  const name = p.author_name || p.username;

  $('#root').innerHTML = `
  <div class="detail-grid">
    <div>
      <div class="gallery-main"><img id="mainImg" src="${esc(imgs[0])}" alt="${esc(p.title)}"></div>
      ${imgs.length > 1 ? `<div class="thumbs">${imgs.map((u, i) => `<button class="${i === 0 ? 'on' : ''}" data-i="${i}" aria-label="${i + 1}"><img src="${esc(u)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}
      ${embed ? `<div class="video"><iframe src="${esc(embed)}" title="video" loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>` : ''}
      ${sections}
    </div>
    <aside>
      <div class="side-card">
        <span class="badge" style="position:static;display:inline-block">${esc(modeLabel(p.mode))}</span>
        <h1 style="margin-top:12px">${esc(p.title)}</h1>
        <div class="meta-line"><span>📍 ${esc(p.location)}</span><span>⏱ ${esc(durLabel(p.duration))}</span><span>📅 ${esc(fmtDate(p.created_at))}</span></div>
        <a class="author" href="public-profile.html?u=${encodeURIComponent(p.username)}" style="margin-top:16px;color:var(--text);text-decoration:none">
          <img class="avatar lg" src="${esc(avatarSrc(p.author_avatar, name))}" alt=""><span><b>${esc(name)}</b><br><small class="muted">@${esc(p.username)}</small></span></a>
        <div class="mt" style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-soft btn-sm" id="shareBtn">🔗 ${esc(t('share'))}</button>
          ${mine ? `<a class="btn btn-ghost btn-sm" href="share-experience.html?edit=${esc(p.id)}">✏️ ${esc(t('edit'))}</a><button class="btn btn-danger btn-sm" id="delBtn">🗑 ${esc(t('delete'))}</button>` : `<button class="btn btn-soft btn-sm" id="reportBtn">⚑ ${esc(t('report'))}</button>`}
        </div>
      </div>

      <div class="side-card">
        <h3>${esc(t('rating_title'))}</h3>
        <div class="stars mt" id="avgText"></div>
        ${mine ? `<p class="hint mt">${esc(t('rate_own_post'))}</p>` : `
          <div class="rate-stars mt" id="stars" role="group" aria-label="${esc(t('rating_title'))}">${[1, 2, 3, 4, 5].map(n => `<button data-s="${n}" aria-label="${n}">★</button>`).join('')}</div>
          <p class="hint mt" id="rateHint">${esc(state.user ? t('rate_hint') : t('login_to_rate'))}</p>`}
      </div>

      <div class="side-card">
        <h3>${esc(t('comments_title'))} <span class="muted" id="cCount"></span></h3>
        <div id="comments" class="mt"></div>
        ${state.user ? `<form id="cForm" class="mt"><div class="field" style="margin-bottom:10px"><textarea id="cBody" maxlength="1000" style="min-height:80px" placeholder="${esc(t('comment_ph'))}"></textarea></div><button class="btn btn-primary btn-sm" type="submit">${esc(t('comment_send'))}</button></form>`
          : `<p class="hint mt"><a href="login.html?next=${encodeURIComponent('post-detail.html?id=' + p.id)}">${esc(t('nav_login'))}</a> ${esc(t('login_to_comment'))}</p>`}
      </div>
    </aside>
  </div>`;

  $$('.thumbs button').forEach(b => b.onclick = () => {
    $('#mainImg').src = imgs[+b.dataset.i];
    $$('.thumbs button').forEach(x => x.classList.toggle('on', x === b));
  });
  paintRating();
  $$('#stars button').forEach(b => b.onclick = () => rate(+b.dataset.s));
  $('#shareBtn').onclick = share;
  if ($('#delBtn')) $('#delBtn').onclick = del;
  if ($('#reportBtn')) $('#reportBtn').onclick = () => report('post', p.id);
  if ($('#cForm')) $('#cForm').addEventListener('submit', sendComment);
}

function paintRating() {
  const p = post;
  $('#avgText').textContent = p.votes > 0 ? `★ ${Number(p.avg_score).toFixed(1)} / 5  ·  ${t('votes_count', { n: p.votes })}` : t('no_votes');
  $$('#stars button').forEach(b => b.classList.toggle('on', +b.dataset.s <= myScore));
}
async function rate(score) {
  if (!state.user) return (location.href = `login.html?next=${encodeURIComponent('post-detail.html?id=' + id)}`);
  const { error } = await sb.from('post_ratings').upsert({ post_id: id, user_id: state.user.id, score }, { onConflict: 'post_id,user_id' });
  if (error) return toast(friendlyError(error), 'err');
  myScore = score; toast(t('rate_thanks'), 'ok');
  const { data } = await sb.from('posts_feed').select('avg_score,votes').eq('id', id).single();
  if (data) { post.avg_score = data.avg_score; post.votes = data.votes; }
  paintRating();
}
async function share() {
  const url = location.href.split('#')[0];
  try { if (navigator.share) { await navigator.share({ title: post.title, url }); return; } } catch { return; }
  try { await navigator.clipboard.writeText(url); toast(t('link_copied'), 'ok'); } catch { prompt(t('share'), url); }
}
async function del() {
  const ok = await modal({ title: t('delete_post_t'), body: t('delete_post_d'), confirmText: t('delete'), danger: true });
  if (!ok) return;
  const { error } = await sb.from('posts').delete().eq('id', id);
  if (error) return toast(friendlyError(error), 'err');
  try { await removeImages('post-images', post.images); } catch {}
  location.href = 'profile.html?tab=posts';
}
async function report(type, targetId) {
  if (!state.user) return (location.href = `login.html?next=${encodeURIComponent('post-detail.html?id=' + id)}`);
  const reason = await modal({ title: t('report_title'), body: t('report_desc'), input: { placeholder: t('report_ph'), max: 500 }, confirmText: t('report_send') });
  if (!reason || reason.length < 3) return;
  const { error } = await sb.from('reports').insert({ reporter_id: state.user.id, target_type: type, target_id: targetId, reason });
  toast(error ? friendlyError(error) : t('report_thanks'), error ? 'err' : 'ok');
}

async function loadComments() {
  const { data, error } = await sb.from('comments').select('id,body,created_at,user_id,profiles(username,full_name,avatar_url)').eq('post_id', id).order('created_at', { ascending: true });
  if (error) return;
  $('#cCount').textContent = `(${data.length})`;
  $('#comments').innerHTML = data.length ? data.map(c => {
    const pr = c.profiles || {}, name = pr.full_name || pr.username || '?';
    const canDel = state.user && (state.user.id === c.user_id || state.user.id === post.user_id);
    const canReport = state.user && state.user.id !== c.user_id;
    return `<div class="comment"><img class="avatar lg" style="width:36px;height:36px" src="${esc(avatarSrc(pr.avatar_url, name))}" alt="">
      <div style="min-width:0"><b>${esc(name)}</b><small>${esc(fmtDate(c.created_at))}</small>
      ${canDel ? `<button class="linkbtn" data-del="${esc(c.id)}">${esc(t('delete'))}</button>` : ''}${canReport ? `<button class="linkbtn" data-rep="${esc(c.id)}">${esc(t('report'))}</button>` : ''}
      <p>${esc(c.body)}</p></div></div>`;
  }).join('') : `<p class="hint">${esc(t('no_comments'))}</p>`;
  $$('[data-del]').forEach(b => b.onclick = async () => {
    const { error } = await sb.from('comments').delete().eq('id', b.dataset.del);
    if (error) toast(friendlyError(error), 'err'); else loadComments();
  });
  $$('[data-rep]').forEach(b => b.onclick = () => report('comment', b.dataset.rep));
}
async function sendComment(e) {
  e.preventDefault();
  const body = $('#cBody').value.trim();
  if (!body) return;
  const { error } = await sb.from('comments').insert({ post_id: id, user_id: state.user.id, body });
  if (error) return toast(friendlyError(error), 'err');
  $('#cBody').value = ''; loadComments();
}
window.addEventListener('langchange', () => { if (post) { render(); loadComments(); } });
</script>
</body></html>
